<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Store Settings - Bakery Cloud</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background: var(--bg); color: #fff; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }

        /* Consistent Glow Background */
        .bg-glow {
            position: absolute; width: 350px; height: 350px;
            background: var(--primary); filter: blur(160px);
            opacity: 0.12; z-index: -1; animation: orbit 15s linear infinite;
        }
        @keyframes orbit { from { transform: rotate(0deg) translateX(80px) rotate(0deg); } to { transform: rotate(360deg) translateX(80px) rotate(-360deg); } }

        .container {
            width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.03);
            padding: 35px 25px; border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px); box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        h2 { margin-bottom: 25px; font-weight: 900; font-size: 24px; letter-spacing: -1px; display: flex; align-items: center; gap: 12px; }
        h2 i { color: var(--primary); font-size: 20px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        input {
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 15px; font-weight: 600;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); }
        input::placeholder { color: #475569; font-weight: 400; }

        .btn-save {
            width: 100%; padding: 18px; background: #fff; color: #000;
            border: none; border-radius: 18px; font-weight: 800; font-size: 15px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-save:active { transform: scale(0.97); }

        /* Data Maintenance Section */
        .backup-section { margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .backup-title { font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 15px; display: block; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-outline {
            padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.08); }

        .back-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 30px; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.3s;
        }
        .back-link:hover { color: #fff; }

        .status-msg {
            background: rgba(16, 185, 129, 0.15); color: var(--success);
            padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
            margin-top: 15px; text-align: center; display: none;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <h2><i class="fa-solid fa-gear"></i> Store Identity</h2>
    
    <div class="form-group">
        <label>Bakery / Business Name</label>
        <input type="text" id="storeName" placeholder="e.g. Surjya Bakery">
    </div>

    <div class="form-group">
        <label>Contact Number (For Invoice)</label>
        <input type="text" id="storePhone" placeholder="+91 0000000000">
    </div>

    <div class="form-group">
        <label>Store Address</label>
        <input type="text" id="storeAddress" placeholder="Street, City, PIN">
    </div>

    <div class="form-group">
        <label>Currency Symbol</label>
        <input type="text" id="currency" placeholder="₹">
    </div>

    <button class="btn-save" onclick="saveSettings()">UPDATE CLOUD CONFIG</button>
    <div id="statusMsg" class="status-msg">Changes saved to Cloud! ✓</div>

    <div class="backup-section">
        <span class="backup-title">Cloud Maintenance & Backups</span>
        <div class="btn-grid">
            <button class="btn-outline" onclick="exportData()"><i class="fa-solid fa-download"></i> EXPORT</button>
            <button class="btn-outline" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> RESTORE</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>

    <a href="dashboard.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> RETURN TO DASHBOARD</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = async function() {
        const docRef = db.collection("settings").doc("store_config");
        const doc = await docRef.get();

        if (doc.exists) {
            const data = doc.data();
            document.getElementById("storeName").value = data.name || "";
            document.getElementById("storePhone").value = data.phone || "";
            document.getElementById("storeAddress").value = data.address || "";
            document.getElementById("currency").value = data.currency || "₹";
            localStorage.setItem("bakery_settings", JSON.stringify(data));
        }
    };

    async function saveSettings() {
        const settings = {
            name: document.getElementById("storeName").value,
            phone: document.getElementById("storePhone").value,
            address: document.getElementById("storeAddress").value,
            currency: document.getElementById("currency").value,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        try {
            await db.collection("settings").doc("store_config").set(settings);
            localStorage.setItem("bakery_settings", JSON.stringify(settings));
            
            const msg = document.getElementById("statusMsg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 3000);
        } catch (e) {
            alert("Error saving: " + e.message);
        }
    }

    async function exportData() {
        const collections = ["items", "orders", "cashflow", "ledger"];
        let allData = { backupDate: new Date().toISOString() };

        for(let col of collections) {
            const snap = await db.collection(col).get();
            allData[col] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `Bakery_Cloud_Backup_${new Date().toLocaleDateString()}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(confirm("Dhyan de! Ye action Cloud ke purane data ko delete/overwrite kar sakta hai. Continue?")) {
                    for(let col in data) {
                        if(Array.isArray(data[col])) {
                            for(let item of data[col]) {
                                const {id, ...rest} = item;
                                await db.collection(col).doc(id || undefined).set(rest);
                            }
                        }
                    }
                    alert("Cloud Restore Successful!");
                    location.reload();
                }
            } catch (err) { alert("Invalid Backup File Format!"); }
        };
        reader.readAsText(file);
    }
</script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error:", message, "at", source, lineno);
    };
</script>
</body>
</html>
