<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>POS - Surjya Bakery Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* Minimal & Consistent Theme */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; transition: 0.3s; }
        body.dark { background: #0f172a; color: #f1f5f9; }

        .app { display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { 
            width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; 
            padding: 30px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; transition: 0.4s; z-index: 1000; 
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }

        .profile { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 10px; }
        .logo { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; }
        
        .menu { list-style: none; flex-grow: 1; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; transition: 0.2s; 
            margin-bottom: 4px; font-size: 14px; color: #64748b; font-weight: 500;
        }
        .menu li:hover { background: #f1f5f9; color: #0f172a; }
        .menu li.active { background: #000; color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; padding-bottom: 100px; }
        
        .top-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; justify-content: space-between; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .back-btn, .set-btn { background: #fff; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        body.dark .back-btn, body.dark .set-btn { background: #1e293b; border-color: #334155; color: #fff; }

        /* Billing Cards */
        .card { background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; }
        body.dark .card { background: #1e293b; border-color: #334155; }
        
        .grid-inputs { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        input, select { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; color: #1e293b; outline: none; width: 100%; font-size: 14px; }
        body.dark input, body.dark select { background: #0f172a; border-color: #334155; color: #fff; }

        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; color: #94a3b8; border-bottom: 1px solid #f1f5f9; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 500; }
        body.dark th, body.dark td { border-color: #334155; }

        /* Buttons */
        .btn { padding: 14px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; transition: 0.2s; }
        .btn-add { background: #000; color: white; }
        body.dark .btn-add { background: #f8fafc; color: #000; }
        .btn-print { background: #10b981; color: white; width: 100%; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .modal-content { background: #fff; padding: 30px; border-radius: 24px; width: 100%; max-width: 450px; }
        body.dark .modal-content { background: #1e293b; color: #fff; }

        /* PRINT STYLES */
        #printSection { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printSection, #printSection * { visibility: visible; }
            #printSection { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: #fff !important; color: #000 !important; }
        }

        /* --- DESIGN TEMPLATE: PREMIUM ORANGE --- */
        .tpl-premium-orange { padding: 0; font-family: 'Inter', sans-serif; background: #fff !important; }
        .tpl-premium-orange .inv-header { background: #0f172a !important; color: #fff !important; padding: 40px; position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; -webkit-print-color-adjust: exact; }
        .tpl-premium-orange .inv-header::after { content: ""; position: absolute; right: 0; top: 0; width: 40%; height: 100%; background: #f97316 !important; transform: skewX(-20deg) translateX(50%); z-index: 1; -webkit-print-color-adjust: exact; }
        .tpl-premium-orange .header-content { position: relative; z-index: 2; }
        .tpl-premium-orange .inv-body { padding: 40px; background: #fff; color: #333; }
        .tpl-premium-orange .section-title { background: #f97316 !important; color: #fff !important; padding: 5px 12px; font-weight: 800; display: inline-block; margin-bottom: 8px; border-radius: 4px; -webkit-print-color-adjust: exact; }
        .tpl-premium-orange table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .tpl-premium-orange th { background: #f97316 !important; color: #fff !important; padding: 12px; text-align: left; -webkit-print-color-adjust: exact; }
        .tpl-premium-orange td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #000; }
        .tpl-premium-orange .total-box { margin-top: 30px; text-align: right; background: #f8fafc !important; padding: 20px; border-radius: 12px; -webkit-print-color-adjust: exact; }
        .tpl-premium-orange .grand-total { color: #f97316 !important; font-size: 32px; font-weight: 900; -webkit-print-color-adjust: exact; }

        @media(max-width: 768px){ .sidebar { display: none; } .content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="profile">
            <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
            <div class="profile-info"><h4>Surjya Bakery</h4><p>POS Terminal</p></div>
        </div>
        <ul class="menu">
            <li class="active"><i class="fa-solid fa-file-invoice"></i> Billing</li>
            <li onclick="window.location.href='ledger.html'"><i class="fa-solid fa-book"></i> Ledger</li>
            <li onclick="openSettings()"><i class="fa-solid fa-gear"></i> Settings</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="back-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 style="font-weight: 800;">Billing</h2>
            </div>
            <button class="set-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
        </header>

        <div class="card">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input id="custName" placeholder="Customer Name">
                <input id="custPhone" type="tel" placeholder="Mobile Number">
            </div>
        </div>

        <div class="card">
            <input id="iName" placeholder="🔍 Search Product..." style="margin-bottom: 12px;">
            <div class="grid-inputs">
                <input id="iQty" type="number" placeholder="Qty" value="1">
                <input id="iPrice" type="number" placeholder="Price">
                <button class="btn btn-add" onclick="addItem()">+ ADD</button>
            </div>
        </div>

        <div class="card">
            <table>
                <thead><tr><th>Item</th><th>Qty</th><th>Total</th><th style="width:40px;"></th></tr></thead>
                <tbody id="cartTable"></tbody>
            </table>
        </div>

        <div style="max-width: 400px; margin-left: auto;">
            <div class="card" style="background: #000; color: #fff; text-align: center;">
                <p style="opacity: 0.7;">Grand Total</p>
                <h2 id="grandTotal" style="color: #10b981; font-size: 32px;">₹0.00</h2>
            </div>
            <button class="btn btn-print" onclick="saveAndPrint()"><i class="fa-solid fa-print"></i> PRINT INVOICE</button>
        </div>
    </main>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px;">Store Settings</h3>
        <input type="text" id="setStoreName" placeholder="Bakery Name" style="margin-bottom:10px;">
        <input type="text" id="setStoreAddress" placeholder="Address" style="margin-bottom:15px;">
        
        <label style="font-size: 12px; font-weight: 700; color: #64748b;">INVOICE DESIGN</label>
        <select id="setInvTemplate" style="margin-top:5px; margin-bottom:20px;">
            <option value="tpl-premium-orange">Premium Orange (Photo Style)</option>
            <option value="tpl-standard">Standard Minimal</option>
        </select>
        
        <button class="btn btn-add" style="width:100%;" onclick="saveSettings()">Save & Close</button>
        <button class="btn" style="width:100%; margin-top:10px; background:transparent; color:#94a3b8;" onclick="closeSettings()">Cancel</button>
    </div>
</div>

<div id="printSection"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [];
    let invNo = "INV-" + Date.now().toString().slice(-6);
    // Default values taaki undefined na dikhe
    let storeData = { name: "Surjya Bakery", address: "Kolkata, WB", template: "tpl-premium-orange" };

    // 1. Fetch current settings on load
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const doc = await db.collection("settings").doc("admin").get();
            if (doc.exists) {
                const data = doc.data();
                storeData.name = data.name || "Surjya Bakery";
                storeData.address = data.address || "Kolkata, WB";
                storeData.template = data.template || "tpl-premium-orange";
                
                // UI inputs update karein
                document.getElementById("setStoreName").value = storeData.name;
                document.getElementById("setStoreAddress").value = storeData.address;
                document.getElementById("setInvTemplate").value = storeData.template;
            }
        } catch (err) { console.error("Data load failed:", err); }
    });

    function addItem() {
        let name = document.getElementById("iName").value;
        let qty = parseFloat(document.getElementById("iQty").value) || 1;
        let price = parseFloat(document.getElementById("iPrice").value);
        if(!name || !price) return;
        cart.push({ name, qty, price, total: qty * price });
        renderCart();
        document.getElementById("iName").value = "";
        document.getElementById("iPrice").value = "";
    }

    function renderCart() {
        let html = ""; let total = 0;
        cart.forEach((item, i) => {
            total += item.total;
            html += `<tr><td>${item.name}</td><td>${item.qty}</td><td>₹${item.total.toFixed(2)}</td><td onclick="cart.splice(${i},1);renderCart()"><i class="fa-solid fa-xmark" style="color:red; cursor:pointer;"></i></td></tr>`;
        });
        document.getElementById("grandTotal").innerText = `₹${total.toFixed(2)}`;
        document.getElementById("cartTable").innerHTML = html;
    }

    async function saveSettings() {
        const newName = document.getElementById("setStoreName").value;
        const newAddress = document.getElementById("setStoreAddress").value;
        const newTemplate = document.getElementById("setInvTemplate").value;

        try {
            await db.collection("settings").doc("admin").update({
                name: newName,
                address: newAddress,
                template: newTemplate
            });
            storeData.name = newName;
            storeData.address = newAddress;
            storeData.template = newTemplate;
            alert("Settings updated!");
            closeSettings();
        } catch (e) { alert("Error updating settings."); }
    }

    function buildInvoice() {
        const cName = document.getElementById("custName").value || "Guest Customer";
        const total = document.getElementById("grandTotal").innerText;
        const date = new Date().toLocaleDateString('en-GB');
        
        // Safety checks for undefined values
        const sName = storeData.name || "Surjya Bakery";
        const sAddr = storeData.address || "";
        const template = storeData.template || "tpl-premium-orange";

        let rows = "";
        cart.forEach(item => {
            rows += `<tr><td>${item.name}</td><td>${item.qty}</td><td>₹${item.price.toFixed(2)}</td><td align="right">₹${item.total.toFixed(2)}</td></tr>`;
        });

        const printArea = document.getElementById("printSection");
        printArea.className = template;
        
        printArea.innerHTML = `
            <div class="inv-header">
                <div class="header-content">
                    <h1 style="font-size: 35px; margin:0;">INVOICE</h1>
                    <p># ${invNo}</p>
                </div>
                <div class="header-content" style="text-align: right;">
                    <h2 style="margin:0;">${sName}</h2>
                    <p style="font-size:12px;">${sAddr}</p>
                </div>
            </div>
            <div class="inv-body">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <div>
                        <span class="section-title">BILL TO</span>
                        <h3 style="margin:0;">${cName}</h3>
                        <p style="font-size:13px;">${document.getElementById("custPhone").value || ""}</p>
                    </div>
                    <div style="text-align: right;">
                        <span class="section-title">DATE</span>
                        <h3 style="margin:0;">${date}</h3>
                    </div>
                </div>
                <table>
                    <thead><tr><th>DESCRIPTION</th><th>QTY</th><th>PRICE</th><th align="right">TOTAL</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="total-box">
                    <p style="margin:0; font-size:14px;">Total Amount</p>
                    <h1 class="grand-total">${total}</h1>
                </div>
                <div style="text-align:center; margin-top:50px; color:#94a3b8; font-size:12px;">
                    <p>Thank you for shopping at ${sName}!</p>
                </div>
            </div>`;
    }

    function saveAndPrint() {
        if(cart.length === 0) return alert("Cart is empty!");
        buildInvoice();
        setTimeout(() => { window.print(); location.reload(); }, 500);
    }

    function openSettings() { document.getElementById("settingsModal").style.display = "flex"; }
    function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }
</script>
</body>
</html>
