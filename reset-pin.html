<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Security Settings - Surjya Bakery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #0f172a; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }

    body {
        min-height:100vh; display:flex; justify-content:center; align-items:center;
        background: var(--bg); color:white; overflow:hidden; padding: 20px;
    }

    /* Consistent Glow Background */
    .bg-glow {
        position: absolute; width: 350px; height: 350px;
        background: var(--primary); filter: blur(160px);
        opacity: 0.15; z-index: -1; animation: orbit 15s linear infinite;
    }
    @keyframes orbit { from { transform: rotate(0deg) translateX(80px) rotate(0deg); } to { transform: rotate(360deg) translateX(80px) rotate(-360deg); } }

    .reset-card {
        width: 100%; max-width: 380px; padding: 40px 25px; border-radius: 32px;
        background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
        box-shadow: 0 40px 100px rgba(0,0,0,0.4);
    }

    .icon-header {
        width: 65px; height: 65px; background: rgba(255, 255, 255, 0.05);
        color: var(--primary); border-radius: 20px; display: inline-flex;
        align-items: center; justify-content: center; font-size: 28px;
        margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 { font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 30px; font-weight: 500; }

    input {
        width: 100%; padding: 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04); color: white; text-align: center;
        font-size: 20px; font-weight: 800; letter-spacing: 10px; outline: none; transition: 0.3s;
        margin-bottom: 15px;
    }
    input::placeholder { letter-spacing: normal; font-size: 14px; font-weight: 400; color: #475569; }
    input:focus { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }

    .btn {
        width: 100%; padding: 18px; border-radius: 18px; border: none;
        font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        letter-spacing: 0.5px;
    }
    .btn-update { background: white; color: #000; margin-top: 10px; }
    .btn-update:active { transform: scale(0.97); }
    
    .btn-back { background: transparent; color: #64748b; margin-top: 12px; }

    .status-msg { margin-top: 20px; font-size: 12px; font-weight: 700; transition: 0.3s; text-transform: uppercase; }
    .error { color: var(--danger); }
    .success { color: var(--success); }
    .loading { color: var(--primary); }

</style>
</head>

<body>
<div class="bg-glow"></div>

<div class="reset-card">
    <div class="icon-header">
        <i class="fa-solid fa-lock"></i>
    </div>
    <h2>Security</h2>
    <p>Secure your administrative access</p>

    <input type="password" id="oldPin" placeholder="ENTER CURRENT PIN" inputmode="numeric" maxlength="4">
    <input type="password" id="newPin" placeholder="SET NEW PIN" inputmode="numeric" maxlength="4">
    <input type="password" id="confirmPin" placeholder="CONFIRM NEW PIN" inputmode="numeric" maxlength="4">

    <button class="btn btn-update" onclick="savePin()">
        UPDATE ACCESS PIN
    </button>
    <button class="btn btn-back" onclick="goBack()">Return to Login</button>

    <div id="message" class="status-msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
  authDomain: "billingbuddy-551f9.firebaseapp.com",
  projectId: "billingbuddy-551f9",
  appId: "1:287026017084:web:aae879570ad706e5a2a439"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messageBox = document.getElementById("message");

window.savePin = async function(){
  const oldPin = document.getElementById("oldPin").value.trim();
  const newPin = document.getElementById("newPin").value.trim();
  const confirmPin = document.getElementById("confirmPin").value.trim();

  if(!oldPin || !newPin || !confirmPin) return updateStatus("All fields required", "error");
  if(newPin.length !== 4) return updateStatus("PIN must be 4 digits", "error");
  if(newPin !== confirmPin) return updateStatus("Confirmation mismatch", "error");

  updateStatus("Syncing with Cloud...", "loading");

  try {
    const adminRef = doc(db, "settings", "admin");
    const adminSnap = await getDoc(adminRef);

    if(!adminSnap.exists()) return updateStatus("System Database Error", "error");

    const currentSavedPin = String(adminSnap.data().pin);

    if(oldPin !== currentSavedPin) return updateStatus("Wrong Current PIN", "error");

    await updateDoc(adminRef, { pin: newPin });
    updateStatus("PIN Successfully Updated", "success");

    setTimeout(() => window.location.replace("index.html"), 1500);

  } catch (err) {
    updateStatus("Connection Failed", "error");
  }
};

function updateStatus(text, type) {
    messageBox.innerText = text;
    messageBox.className = "status-msg " + type;
}

window.goBack = function() {
  window.location.replace("index.html");
};
</script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error:", message, "at", source, lineno);
    };
</script>
</body>
</html>
