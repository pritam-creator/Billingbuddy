<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Security Settings - Surjya Bakery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #0f172a; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }

    body {
        min-height:100vh; display:flex; justify-content:center; align-items:center;
        background: var(--bg); color:white; overflow:hidden; padding: 20px;
    }

    /* Consistent Glow Background */
    .bg-glow {
        position: absolute; width: 350px; height: 350px;
        background: var(--primary); filter: blur(160px);
        opacity: 0.15; z-index: -1; animation: orbit 15s linear infinite;
    }
    @keyframes orbit { from { transform: rotate(0deg) translateX(80px) rotate(0deg); } to { transform: rotate(360deg) translateX(80px) rotate(-360deg); } }

    .reset-card {
        width: 100%; max-width: 380px; padding: 40px 25px; border-radius: 32px;
        background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
        box-shadow: 0 40px 100px rgba(0,0,0,0.4);
    }

    .icon-header {
        width: 65px; height: 65px; background: rgba(255, 255, 255, 0.05);
        color: var(--primary); border-radius: 20px; display: inline-flex;
        align-items: center; justify-content: center; font-size: 28px;
        margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 { font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 30px; font-weight: 500; }

    /* Fix 1: Fixed character masking placeholder style engine */
    input {
        width: 100%; padding: 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04); color: white; text-align: center;
        font-size: 22px; font-weight: 800; letter-spacing: 8px; outline: none; transition: 0.3s;
        margin-bottom: 15px;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input::placeholder { letter-spacing: normal; font-size: 13px; font-weight: 500; color: #475569; }
    input:focus { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }

    .btn {
        width: 100%; padding: 18px; border-radius: 18px; border: none;
        font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        letter-spacing: 0.5px;
    }
    .btn-update { background: white; color: #000; margin-top: 10px; }
    .btn-update:active { transform: scale(0.97); }
    .btn-update:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-back { background: transparent; color: #64748b; margin-top: 12px; }

    .status-msg { margin-top: 20px; font-size: 12px; font-weight: 700; transition: 0.3s; text-transform: uppercase; line-height: 1.4; }
    .error { color: var(--danger); }
    .success { color: var(--success); }
    .loading { color: var(--primary); }

</style>
</head>

<body>
<div class="bg-glow"></div>

<div class="reset-card">
    <div class="icon-header">
        <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2>Security Dashboard</h2>
    <p>Secure your administrative terminal</p>

    <input type="password" id="oldPin" placeholder="ENTER CURRENT PIN" inputmode="numeric" pattern="[0-9]*" maxlength="4">
    <input type="password" id="newPin" placeholder="SET NEW 4-DIGIT PIN" inputmode="numeric" pattern="[0-9]*" maxlength="4">
    <input type="password" id="confirmPin" placeholder="CONFIRM NEW PIN" inputmode="numeric" pattern="[0-9]*" maxlength="4">

    <button class="btn btn-update" id="submitBtn" onclick="savePin()">
        UPDATE ACCESS PIN
    </button>
    <button class="btn btn-back" onclick="goBack()">Return to Login</button>

    <div id="message" class="status-msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
  authDomain: "billingbuddy-551f9.firebaseapp.com",
  projectId: "billingbuddy-551f9",
  appId: "1:287026017084:web:aae879570ad706e5a2a439"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messageBox = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

let brutalAttemptsCounter = 0;

// Fix 1: High-security cryptographic hash compiler block
async function hashSHA256(string) {
    const utf8 = new TextEncoder().encode(string);
    const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

window.savePin = async function(){
  if(brutalAttemptsCounter >= 5) {
      return updateStatus("Terminal Locked! Too many attempts.", "error");
  }

  const oldPinRaw = document.getElementById("oldPin").value.trim();
  const newPinRaw = document.getElementById("newPin").value.trim();
  const confirmPinRaw = document.getElementById("confirmPin").value.trim();

  // Field validation matrix
  if(!oldPinRaw || !newPinRaw || !confirmPinRaw) return updateStatus("All authorization fields required", "error");
  if(!/^\d{4}$/.test(newPinRaw) || !/^\d{4}$/.test(oldPinRaw)) return updateStatus("PIN structure must be 4 digits", "error");
  if(newPinRaw !== confirmPinRaw) return updateStatus("Confirmation credentials mismatch", "error");
  if(oldPinRaw === newPinRaw) return updateStatus("New PIN cannot match old identity", "error");

  updateStatus("Verifying secure token...", "loading");
  submitBtn.disabled = true;

  try {
    const adminRef = doc(db, "settings", "admin");
    const adminSnap = await getDoc(adminRef);

    if(!adminSnap.exists()) {
        submitBtn.disabled = false;
        return updateStatus("System configuration registry missing", "error");
    }

    const currentSavedDbPin = String(adminSnap.data().pin);
    
    // Hash execution layers
    const hashedOldInput = await hashSHA256(oldPinRaw);
    const hashedNewInput = await hashSHA256(newPinRaw);

    // Secure fallback verification check
    const isMatched = (oldPinRaw === currentSavedDbPin || hashedOldInput === currentSavedDbPin);

    if(!isMatched) {
        brutalAttemptsCounter++;
        submitBtn.disabled = false;
        const remaining = 5 - brutalAttemptsCounter;
        return updateStatus(`Access Denied. ${remaining} attempts remaining`, "error");
    }

    updateStatus("Deploying safe keys to Cloud...", "loading");
    
    // Cloud storage saves only cryptographically hashed strings
    await updateDoc(adminRef, { pin: hashedNewInput });
    updateStatus("PIN Encryption Updated Successfully", "success");

    if (window.navigator.vibrate) window.navigator.vibrate([40, 40]);
    setTimeout(() => window.location.replace("index.html"), 1500);

  } catch (err) {
    console.error("Cryptographic sync failure:", err);
    updateStatus("Connection Failure or Corrupted Token", "error");
    submitBtn.disabled = false;
  }
};

window.goBack = function() {
  window.location.replace("index.html");
};

// Automatic maximum constraint limit filters for 4 digits keyup events
['oldPin', 'newPin', 'confirmPin'].forEach(id => {
    const element = document.getElementById(id);
    if(element) {
        element.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
        });
    }
});
</script>
</body>
</html>
