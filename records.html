<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Cloud Cash - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; --card: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: var(--bg); color: #1e293b; min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
        body.dark { background: #0f172a; color: #f1f5f9; --bg: #0f172a; --card: #1e293b; }

        .app { display: flex; height: 100vh; }

        /* Sidebar Consistency */
        .sidebar { 
            width: 260px; background: var(--card); border-right: 1px solid #e2e8f0; 
            padding: 25px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; z-index: 1000;
        }
        body.dark .sidebar { border-color: #334155; }
        .logo { width: 45px; height: 45px; border-radius: 12px; margin-bottom: 30px; cursor: pointer; }
        
        .menu { list-style: none; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; transition: 0.2s; 
            margin-bottom: 5px; font-size: 14px; color: #64748b; font-weight: 600;
        }
        .menu li.active { background: #000; color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        
        .top-header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { background: var(--card); border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        body.dark .back-btn { border-color: #334155; color: #fff; }

        /* Premium Cash Card */
        .summary-card { 
            background: #000; color: #fff; width: 100%; max-width: 500px; 
            padding: 35px 30px; border-radius: 35px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative; overflow: hidden;
        }
        body.dark .summary-card { background: #1e293b; border: 1px solid #334155; }
        
        .balance-label { font-size: 12px; font-weight: 800; opacity: 0.6; text-transform: uppercase; letter-spacing: 1.5px; }
        .balance-amt { font-size: 42px; font-weight: 900; margin: 12px 0; letter-spacing: -1.5px; }
        
        .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        .stat-col p { font-size: 10px; font-weight: 800; opacity: 0.5; margin-bottom: 8px; letter-spacing: 0.5px; }
        .stat-col h4 { font-size: 18px; font-weight: 900; }

        /* Records List */
        .records-list { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 120px; }
        .record-card { 
            background: var(--card); padding: 20px; border-radius: 26px; 
            border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.dark .record-card { border-color: #334155; }
        .record-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        .icon-box { width: 52px; height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .inc-bg { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .exp-bg { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .amt-text { font-size: 17px; font-weight: 900; letter-spacing: -0.5px; }
        .inc-clr { color: #10b981; }
        .exp-clr { color: #ef4444; }

        /* FAB & Modal */
        .fab { position: fixed; bottom: 35px; right: 35px; width: 68px; height: 68px; border-radius: 24px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); cursor: pointer; border: none; transition: 0.3s; z-index: 100; }
        body.dark .fab { background: #fff; color: #000; }
        .fab:active { transform: scale(0.9); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; padding: 35px; border-radius: 35px; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 8px; opacity: 0.6; }
        .modal-input { width: 100%; padding: 18px; border-radius: 18px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 700; outline: none; transition: 0.2s; }
        body.dark .modal-input { background: #0f172a; border-color: #334155; color: #fff; }
        .modal-input:focus { border-color: var(--primary); }

        .btn-save { width: 100%; padding: 18px; border-radius: 18px; border: none; background: #000; color: #fff; font-weight: 800; cursor: pointer; margin-top: 10px; }
        body.dark .btn-save { background: #fff; color: #000; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

        @media(max-width: 768px){ .sidebar { display: none; } .content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo" onclick="go('dashboard.html')">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-house"></i> Dashboard</li>
            <li onclick="go('inventory.html')"><i class="fa-solid fa-boxes-stacked"></i> Inventory</li>
            <li class="active"><i class="fa-solid fa-receipt"></i> Cash Records</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <button class="back-btn" onclick="go('dashboard.html')"><i class="fa-solid fa-chevron-left"></i></button>
            <div style="text-align: center;">
                <h3 id="dateLabel" style="font-weight: 900; font-size: 16px; letter-spacing: -0.5px;">Today</h3>
            </div>
            <div style="width:40px"></div>
        </header>

        <div class="summary-card">
            <p class="balance-label">Current Cash Balance</p>
            <h1 class="balance-amt" id="totalBalance">₹ 0.00</h1>
            <div class="stat-row">
                <div class="stat-col">
                    <p>TOTAL CASH IN</p>
                    <h4 id="incVal" style="color:#4ade80">₹ 0.00</h4>
                </div>
                <div class="stat-col">
                    <p>TOTAL CASH OUT</p>
                    <h4 id="expVal" style="color:#fb7185">₹ 0.00</h4>
                </div>
            </div>
        </div>

        <div class="records-list" id="recordContainer"></div>
    </main>

    <button class="fab" onclick="showModal()"><i class="fa-solid fa-plus"></i></button>
</div>

<div class="modal" id="entryModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="font-weight: 900; letter-spacing: -1px;">New Transaction</h2>
            <i class="fa-solid fa-xmark" onclick="closeModal()" style="cursor:pointer; opacity:0.3; font-size: 20px;"></i>
        </div>
        
        <div class="input-group">
            <label>DESCRIPTION</label>
            <input type="text" id="entryTitle" class="modal-input" placeholder="e.g., Bread Sales, Milk Bill">
        </div>
        
        <div class="input-group">
            <label>AMOUNT (₹)</label>
            <input type="number" step="0.01" id="entryAmt" class="modal-input" placeholder="e.g. 500">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button type="button" onclick="setType('in')" id="btnIn" style="flex:1; padding:12px; border-radius:12px; border:2px solid #10b981; background:rgba(16, 185, 129, 0.1); color:#10b981; font-weight:800; cursor:pointer;">CASH IN</button>
            <button type="button" onclick="setType('out')" id="btnOut" style="flex:1; padding:12px; border-radius:12px; border:2px solid transparent; background:#f1f5f9; color:#64748b; font-weight:800; cursor:pointer;">CASH OUT</button>
        </div>

        <button class="btn-save" id="btnSaveTrans" onclick="saveEntry()">SAVE TRANSACTION</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let entryType = 'in';
    let cashStreamUnsubscribe = null;

    function init() {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        document.getElementById("dateLabel").innerText = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'long', year:'numeric' });
        
        initCashStream();
    }

    function initCashStream() {
        if(cashStreamUnsubscribe) cashStreamUnsubscribe();
        
        cashStreamUnsubscribe = db.collection("cashflow").orderBy("timestamp", "desc")
            .onSnapshot(snap => {
                renderEngine(snap);
            }, err => {
                console.error("Firestore cache pipeline failure:", err);
            });
    }

    function setType(t) {
        entryType = t;
        const btnIn = document.getElementById('btnIn');
        const btnOut = document.getElementById('btnOut');
        
        if(t === 'in') {
            btnIn.style.borderColor = "#10b981"; btnIn.style.background = "rgba(16, 185, 129, 0.1)"; btnIn.style.color = "#10b981";
            btnOut.style.borderColor = "transparent"; btnOut.style.background = "#f1f5f9"; btnOut.style.color = "#64748b";
        } else {
            btnOut.style.borderColor = "#ef4444"; btnOut.style.background = "rgba(239, 68, 68, 0.1)"; btnOut.style.color = "#ef4444";
            btnIn.style.borderColor = "transparent"; btnIn.style.background = "#f1f5f9"; btnIn.style.color = "#64748b";
        }
    }

    // Fix 1 & 2: Structural Document Fragment rendering engine to prevent leakage
    function renderEngine(snap) {
        const container = document.getElementById("recordContainer");
        container.innerHTML = "";
        
        let net = 0; let inc = 0; let exp = 0;

        if(!snap || snap.empty) {
            container.innerHTML = `<div style="text-align:center; padding:30px; opacity:0.5; font-weight:700;">No transactions recorded today.</div>`;
            document.getElementById("totalBalance").innerText = "₹ 0.00";
            document.getElementById("incVal").innerText = "₹ 0.00";
            document.getElementById("expVal").innerText = "₹ 0.00";
            return;
        }

        const fragment = document.createDocumentFragment();

        snap.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            const amt = parseFloat(data.amount) || 0;
            
            // Fix 2: Strict structural mapping based on saved 'flow' field
            const direction = data.flow || (amt >= 0 ? 'in' : 'out');
            const isInc = (direction === 'in');
            const absoluteAmt = Math.abs(amt);

            net += (isInc ? absoluteAmt : -absoluteAmt);
            if(isInc) inc += absoluteAmt; else exp += absoluteAmt;

            const row = document.createElement("div");
            row.className = "record-card";
            row.innerHTML = `
                <div style="display: flex; align-items: center; gap: 18px;">
                    <div class="icon-box ${isInc ? 'inc-bg' : 'exp-bg'}">
                        <i class="fa-solid ${isInc ? 'fa-plus' : 'fa-minus'}"></i>
                    </div>
                    <div>
                        <h4 style="font-size:16px; font-weight:900; letter-spacing:-0.3px;">${data.title || 'Untitled Transaction'}</h4>
                        <p style="font-size:12px; opacity:0.5; font-weight:700;">${data.date || 'Today'}</p>
                    </div>
                </div>
                <div style="text-align: right; display: flex; align-items: center; gap: 18px;">
                    <span class="amt-text ${isInc ? 'inc-clr' : 'exp-clr'}">
                        ${isInc ? '+' : '-'} ₹${absoluteAmt.toLocaleString('en-IN', {minimumFractionDigits: 2})}
                    </span>
                    <i class="fa-solid fa-trash-can system-delete-trigger" style="opacity:0.2; cursor:pointer; font-size:14px; transition: 0.2s;"></i>
                </div>
            `;

            // Fix 1: Event listener allocation architecture
            row.querySelector('.system-delete-trigger').addEventListener('click', () => {
                deleteEntry(id);
            });

            fragment.appendChild(row);
        });

        container.appendChild(fragment);

        document.getElementById("totalBalance").innerText = "₹ " + net.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById("incVal").innerText = "₹ " + inc.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById("expVal").innerText = "₹ " + exp.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }

    async function saveEntry() {
        const titleInput = document.getElementById('entryTitle');
        const amtInput = document.getElementById('entryAmt');
        const saveBtn = document.getElementById('btnSaveTrans');

        const title = titleInput.value.trim();
        let amt = parseFloat(amtInput.value);
        
        if(!title || isNaN(amt) || amt <= 0) return alert("Please enter valid transaction credentials!");
        
        saveBtn.disabled = true;

        try {
            // Fix 2: Always log raw values clearly inside schema architecture
            await db.collection("cashflow").add({
                title: title,
                amount: parseFloat(amt.toFixed(2)),
                flow: entryType, 
                date: new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short' }),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal();
            titleInput.value = "";
            amtInput.value = "";
            setType('in'); // Reset default flow layout state
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        } catch (error) {
            console.error("Data tracking operation crashed:", error);
            alert("Database syncing failure.");
        } finally {
            saveBtn.disabled = false;
        }
    }

    function showModal() { document.getElementById('entryModal').style.display = 'flex'; }
    function closeModal() { 
        document.getElementById('entryModal').style.display = 'none'; 
        document.getElementById('entryTitle').value = "";
        document.getElementById('entryAmt').value = "";
    }

    async function deleteEntry(id) {
        if(confirm("Permanently delete this cash record? This directly alters terminal accounting data.")) {
            try {
                await db.collection("cashflow").doc(id).delete();
            } catch (err) {
                alert("Operation restricted by cloud security configuration layer.");
            }
        }
    }

    function go(p) { 
        if(cashStreamUnsubscribe) cashStreamUnsubscribe();
        window.location.href = p; 
    }
    window.onload = init;
</script>
</body>
</html>
