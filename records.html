<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Cloud Cash - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; overflow-x: hidden; }
        body.dark { background: #0f172a; color: #f1f5f9; }

        .app { display: flex; height: 100vh; }

        /* Sidebar Consistency */
        .sidebar { 
            width: 260px; background: #fff; border-right: 1px solid #e2e8f0; 
            padding: 25px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; z-index: 1000;
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }
        .logo { width: 45px; height: 45px; border-radius: 12px; margin-bottom: 30px; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; transition: 0.2s; 
            margin-bottom: 5px; font-size: 14px; color: #64748b; font-weight: 500;
        }
        .menu li.active { background: #000; color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        
        .top-header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { background: #fff; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        body.dark .back-btn { background: #1e293b; border-color: #334155; }

        /* Premium Cash Card */
        .summary-card { 
            background: #000; color: #fff; width: 100%; max-width: 500px; 
            padding: 30px; border-radius: 32px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; overflow: hidden;
        }
        body.dark .summary-card { background: #1e293b; border: 1px solid #334155; }
        
        .balance-label { font-size: 11px; font-weight: 800; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amt { font-size: 38px; font-weight: 900; margin: 10px 0; letter-spacing: -1px; }
        
        .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .stat-col p { font-size: 10px; font-weight: 700; opacity: 0.5; margin-bottom: 5px; }
        .stat-col h4 { font-size: 16px; font-weight: 800; }

        /* Records List */
        .records-list { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 100px; }
        .record-card { 
            background: #fff; padding: 18px; border-radius: 22px; 
            border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        body.dark .record-card { background: #1e293b; border-color: #334155; }
        
        .icon-box { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .inc-bg { background: #f0fdf4; color: #10b981; }
        .exp-bg { background: #fef2f2; color: #ef4444; }

        .amt-text { font-size: 16px; font-weight: 800; }
        .inc-clr { color: #10b981; }
        .exp-clr { color: #ef4444; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; border-radius: 22px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); cursor: pointer; border: none; transition: 0.3s; }
        body.dark .fab { background: #fff; color: #000; }
        .fab:hover { transform: scale(1.1); }

        @media(max-width: 768px){ 
            .sidebar { display: none; } 
            .content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-house"></i> Dashboard</li>
            <li onclick="go('inventory.html')"><i class="fa-solid fa-boxes-stacked"></i> Inventory</li>
            <li class="active"><i class="fa-solid fa-receipt"></i> Cash Records</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <button class="back-btn" onclick="go('dashboard.html')"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 id="dateLabel" style="font-weight: 800; font-size: 14px; opacity: 0.6;">Today</h3>
            <div style="width:40px"></div>
        </header>

        <div class="summary-card">
            <p class="balance-label">Cash in Hand</p>
            <h1 class="balance-amt" id="totalBalance">₹ 0.00</h1>
            <div class="stat-row">
                <div class="stat-col">
                    <p>INCOME</p>
                    <h4 id="incVal" style="color:#4ade80">₹ 0</h4>
                </div>
                <div class="stat-col">
                    <p>EXPENSES</p>
                    <h4 id="expVal" style="color:#fb7185">₹ 0</h4>
                </div>
            </div>
        </div>

        <div class="records-list" id="recordContainer"></div>
    </main>

    <button class="fab" onclick="addEntry()"><i class="fa-solid fa-plus"></i></button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function init() {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        document.getElementById("dateLabel").innerText = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'long' });
        
        db.collection("cashflow").orderBy("timestamp", "desc").onSnapshot(snap => render(snap));
    }

    function render(snap) {
        const container = document.getElementById("recordContainer");
        let net = 0; let inc = 0; let exp = 0;
        container.innerHTML = "";

        snap.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            const amt = parseFloat(data.amount);
            const isInc = amt >= 0;

            net += amt;
            if(isInc) inc += amt; else exp += Math.abs(amt);

            container.innerHTML += `
                <div class="record-card">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="icon-box ${isInc ? 'inc-bg' : 'exp-bg'}">
                            <i class="fa-solid ${isInc ? 'fa-arrow-up' : 'fa-arrow-down'}"></i>
                        </div>
                        <div>
                            <h4 style="font-size:15px; font-weight:800;">${data.title}</h4>
                            <p style="font-size:11px; opacity:0.5; font-weight:600;">${data.date}</p>
                        </div>
                    </div>
                    <div style="text-align: right; display: flex; align-items: center; gap: 15px;">
                        <span class="amt-text ${isInc ? 'inc-clr' : 'exp-clr'}">
                            ${isInc ? '+' : '-'} ₹${Math.abs(amt).toLocaleString()}
                        </span>
                        <i class="fa-solid fa-trash" onclick="deleteEntry('${id}')" style="opacity:0.2; cursor:pointer; font-size:12px;"></i>
                    </div>
                </div>
            `;
        });

        document.getElementById("totalBalance").innerText = "₹ " + net.toLocaleString();
        document.getElementById("incVal").innerText = "₹ " + inc.toLocaleString();
        document.getElementById("expVal").innerText = "₹ " + exp.toLocaleString();
    }

    async function addEntry() {
        const title = prompt("Entry Name (e.g., Sales, Flour Purchase):");
        if(!title) return;
        const amtStr = prompt("Amount (Use '-' for Expense, e.g., -200):");
        const amt = parseFloat(amtStr);
        if(isNaN(amt)) return;

        await db.collection("cashflow").add({
            title: title,
            amount: amt,
            date: new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short' }),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    async function deleteEntry(id) {
        if(confirm("Delete this transaction?")) await db.collection("cashflow").doc(id).delete();
    }

    function go(p) { window.location.href = p; }
    window.onload = init;
</script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error:", message, "at", source, lineno);
    };
</script>
</body>
</html>
