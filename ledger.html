<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Ledger - Surjya Bakery Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
        .app { display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Theme Match */
        .sidebar { width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 30px 20px; position: fixed; height: 100%; z-index: 1000; }
        .profile { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .logo { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; }
        .menu { list-style: none; flex-grow: 1; }
        .menu li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; margin-bottom: 4px; font-size: 14px; color: #64748b; }
        .menu li.active { background: #000; color: #fff; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; padding-bottom: 100px; }
        
        /* Top Header */
        .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; gap: 15px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { background: #fff; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1e293b; transition: 0.2s; }
        .back-btn:hover { background: #f1f5f9; }

        .card { background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; }
        
        /* Stats Dashboard Widgets */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-card { padding: 20px; border-radius: 16px; color: white; }
        .stat-due { background: #ef4444; }
        .stat-received { background: #10b981; }

        /* Live Filter Search Box */
        .search-box { background: #fff; border: 1px solid #e2e8f0; padding: 12px 16px; border-radius: 12px; width: 100%; font-size: 14px; outline: none; margin-bottom: 20px; transition: 0.2s; }
        .search-box:focus { border-color: #000; }

        /* Table Design */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px; color: #94a3b8; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #f1f5f9; background: #fafafa; }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        
        /* Reactive Badges */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; }
        .badge-due { background: #ffeeeb; color: #ef4444; }
        .badge-paid { background: #f0fdf4; color: #10b981; }

        @media(max-width: 768px){ .sidebar { display: none; } .content { margin-left: 0; padding: 15px; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="profile">
            <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
            <div><h4>Surjya Bakery</h4><p style="font-size: 10px;">POS System</p></div>
        </div>
        <ul class="menu">
            <li onclick="window.location.href='index.html'"><i class="fa-solid fa-file-invoice"></i> Billing</li>
            <li class="active"><i class="fa-solid fa-book"></i> Ledger</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='index.html'">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h2 style="font-weight: 800;">Customer Ledger</h2>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card stat-due">
                <p style="opacity: 0.8; font-size: 13px;">Total Market Due (Udaari)</p>
                <h2 id="totalMarketDue" style="font-size: 28px; font-weight: 800; margin-top: 5px;">₹0.00</h2>
            </div>
            <div class="stat-card stat-received">
                <p style="opacity: 0.8; font-size: 13px;">Total Cash Received</p>
                <h2 id="totalCashReceived" style="font-size: 28px; font-weight: 800; margin-top: 5px;">₹0.00</h2>
            </div>
        </div>

        <input type="text" id="searchLedger" class="search-box" placeholder="🔍 Search by Customer Name, Invoice, or Mobile Number..." oninput="filterLedger()">

        <div class="card" style="padding:0; overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Inv No</th>
                        <th>Customer Details</th>
                        <th>Net Total</th>
                        <th>Amount Paid</th>
                        <th>Balance Due</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ledgerTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center; color:#94a3b8; padding:30px;">Loading historical transactions...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    // Firebase credentials injection mapped with billing page
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allTransactions = [];

    window.onload = async () => {
        await loadLedgerData();
    };

    // Firebase live synchronization and parsing logic
    async function loadLedgerData() {
        try {
            // Sorting files chronologically by server timestamp
            const snapshot = await db.collection("sales").orderBy("timestamp", "desc").get();
            allTransactions = [];
            
            let marketDue = 0;
            let cashReceived = 0;

            snapshot.forEach(doc => {
                const data = doc.data();
                allTransactions.push(data);

                marketDue += (data.due > 0) ? data.due : 0;
                cashReceived += data.paid || 0;
            });

            // Updating layout summaries
            document.getElementById("totalMarketDue").innerText = `₹${marketDue.toFixed(2)}`;
            document.getElementById("totalCashReceived").innerText = `₹${cashReceived.toFixed(2)}`;

            renderTable(allTransactions);
        } catch (error) {
            console.error("Critical Ledger Fetch Exception:", error);
            document.getElementById("ledgerTableBody").innerHTML = `<tr><td colspan="7" style="text-align:center; color:#ef4444; padding:30px;">Failed to secure database sync. Check cloud indexing permissions.</td></tr>`;
        }
    }

    // Dynamic virtual table rendering engine
    function renderTable(dataList) {
        let html = "";
        if(dataList.length === 0) {
            html = `<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:30px;">No historical matching dataset found.</td></tr>`;
            document.getElementById("ledgerTableBody").innerHTML = html;
            return;
        }

        dataList.forEach(item => {
            let dateStr = "N/A";
            if(item.timestamp) {
                const dateObj = item.timestamp.toDate();
                dateStr = dateObj.toLocaleDateString('en-GB') + " " + dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
            }

            const statusBadge = item.due > 0 
                ? `<span class="badge badge-due"><i class="fa-solid fa-clock"></i> DUE</span>` 
                : `<span class="badge badge-paid"><i class="fa-solid fa-circle-check"></i> PAID</span>`;

            html += `<tr>
                <td style="font-weight:500; color:#475569;">${dateStr}</td>
                <td style="font-family:monospace; font-weight:bold; color:#0f172a;">#${item.invNo || '---'}</td>
                <td>
                    <div style="font-weight:600; color:#1e293b;">${item.customer || 'Guest'}</div>
                    <div style="font-size:11px; color:#64748b;">${item.customerPhone || 'No Phone Registered'}</div>
                </td>
                <td style="font-weight:600;">₹${(item.netTotal || 0).toFixed(2)}</td>
                <td style="color:#10b981; font-weight:600;">₹${(item.paid || 0).toFixed(2)}</td>
                <td style="color:${item.due > 0 ? '#ef4444' : '#1e293b'}; font-weight:700;">₹${(item.due || 0).toFixed(2)}</td>
                <td>${statusBadge}</td>
            </tr>`;
        });
        document.getElementById("ledgerTableBody").innerHTML = html;
    }

    // Instant query filter selector execution
    function filterLedger() {
        const query = document.getElementById("searchLedger").value.toLowerCase().trim();
        if(!query) {
            renderTable(allTransactions);
            return;
        }

        const filtered = allTransactions.filter(item => {
            const name = (item.customer || '').toLowerCase();
            const phone = (item.customerPhone || '').toLowerCase();
            const inv = (item.invNo || '').toLowerCase();
            return name.includes(query) || phone.includes(query) || inv.includes(query);
        });

        renderTable(filtered);
    }
</script>
</body>
</html>
