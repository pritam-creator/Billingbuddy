<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - Surjya Bakery</title>

  <style>
    /* Global Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Image ki jagah ek saaf gradient */
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      padding: 20px;
    }

    /* Ultra Minimal Card */
    .login-box, .reset-box {
      background: #ffffff;
      padding: 50px 40px;
      border-radius: 30px;
      width: 100%;
      max-width: 380px;
      /* Soft shadow for depth */
      box-shadow: 0 10px 25px rgba(0,0,0,0.03), 0 20px 48px rgba(0,0,0,0.05);
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      /* Logo ko thoda utha hua dikhane ke liye */
      filter: grayscale(20%); 
    }

    h2 { 
      margin-bottom: 35px; 
      color: #111827; 
      font-weight: 700; 
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .pin-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
    
    .pin-input, .reset-input {
      width: 52px;
      height: 60px;
      border-radius: 12px;
      border: 1.5px solid #f3f4f6;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      outline: none;
      background: #f9fafb;
      color: #111827;
      transition: all 0.2s ease;
    }
    
    .pin-input:focus, .reset-input:focus {
      background: #fff;
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.03);
    }

    .reset-input { width: 100%; height: 52px; margin-bottom: 12px; font-size: 15px; padding: 0 15px; text-align: left; }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #000;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }
    
    button:hover { background: #1f2937; }
    button:active { transform: scale(0.98); }

    .forgot-link { 
      margin-top: 25px; 
      display: block; 
      color: #9ca3af; 
      font-size: 13px; 
      text-decoration: none; 
      cursor: pointer;
      transition: 0.2s;
    }
    .forgot-link:hover { color: #4b5563; }

    .message { margin-top: 20px; font-size: 13px; min-height: 18px; color: #6b7280; }
    .hidden { display: none; }

    /* Pure White Transition */
    .transition-overlay {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: 0.5s ease-in-out;
    }
    .transition-overlay.active { opacity: 1; pointer-events: all; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="login-box" id="loginBox">
  <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
  <h2>Surjya Bakery</h2>
  <div class="pin-container">
    <input maxlength="1" class="pin-input" type="password" inputmode="numeric">
    <input maxlength="1" class="pin-input" type="password" inputmode="numeric">
    <input maxlength="1" class="pin-input" type="password" inputmode="numeric">
    <input maxlength="1" class="pin-input" type="password" inputmode="numeric">
  </div>
  <button type="button" id="loginBtn">Unlock Dashboard</button>
  <span class="forgot-link" onclick="toggleView('reset')">Settings & Security</span>
  <div class="message" id="message"></div>
</div>

<div class="reset-box hidden" id="resetBox">
  <h2>Update PIN</h2>
  <input type="password" id="oldPin" class="reset-input" maxlength="4" placeholder="Old PIN" inputmode="numeric">
  <input type="password" id="newPin" class="reset-input" maxlength="4" placeholder="New PIN" inputmode="numeric">
  <button type="button" id="resetBtn">Confirm Change</button>
  <span class="forgot-link" onclick="toggleView('login')">Cancel</span>
  <div class="message" id="resetMessage"></div>
</div>

<div class="transition-overlay" id="transition">
  <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" style="width: 60px; opacity: 0.5;">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  // Firebase initialization aur baki logic bilkul pehle jaisa hi rahega
  const firebaseConfig = {
      apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
      authDomain: "billingbuddy-551f9.firebaseapp.com",
      projectId: "billingbuddy-551f9",
      appId: "1:287026017084:web:aae879570ad706e5a2a439"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const inputs = document.querySelectorAll(".pin-input");
  const message = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");
  const overlay = document.getElementById("transition");
  const loginBox = document.getElementById("loginBox");
  const resetBox = document.getElementById("resetBox");

  window.toggleView = (view) => {
      if(view === 'reset'){
          loginBox.classList.add('hidden');
          resetBox.classList.remove('hidden');
      } else {
          resetBox.classList.add('hidden');
          loginBox.classList.remove('hidden');
      }
  }

  inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, '');
      if (input.value && index < 3) inputs[index + 1].focus();
      
      let fullPin = "";
      inputs.forEach(i => fullPin += i.value);
      if (fullPin.length === 4) login();
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && index > 0) inputs[index - 1].focus();
    });
  });

  async function login() {
    let pin = "";
    inputs.forEach(i => pin += i.value);
    if (pin.length !== 4) return;

    message.innerText = "Authenticating...";

    try {
      const docSnap = await db.collection("settings").doc("admin").get();
      if (docSnap.exists && pin === String(docSnap.data().pin)) {
        localStorage.setItem("loggedIn", "true");
        loginBox.style.opacity = "0";
        setTimeout(() => overlay.classList.add("active"), 300);
        setTimeout(() => window.location.replace("dashboard.html"), 1500);
      } else {
        throw new Error("Invalid PIN. Please try again.");
      }
    } catch (e) {
      message.innerText = e.message;
      message.style.color = "#ef4444";
      inputs.forEach(i => i.value = "");
      inputs[0].focus();
    }
  }

  document.getElementById("resetBtn").onclick = async () => {
      const oldPinInput = document.getElementById("oldPin").value;
      const newPinInput = document.getElementById("newPin").value;
      const rMsg = document.getElementById("resetMessage");

      if(oldPinInput.length !== 4 || newPinInput.length !== 4){
          rMsg.style.color = "#ef4444";
          rMsg.innerText = "Enter 4 digits";
          return;
      }

      try {
          const adminRef = db.collection("settings").doc("admin");
          const docSnap = await adminRef.get();
          if(oldPinInput === String(docSnap.data().pin)){
              await adminRef.update({ pin: newPinInput });
              rMsg.style.color = "#10b981";
              rMsg.innerText = "Success! PIN updated.";
              setTimeout(() => location.reload(), 1500);
          } else {
              throw new Error("Current PIN is incorrect.");
          }
      } catch(e) {
          rMsg.style.color = "#ef4444";
          rMsg.innerText = e.message;
      }
  };

  loginBtn.onclick = login;
</script>
<script>
  window.onerror = function(message, source, lineno, colno, error) {
    console.error("Error:", message, "at", source, lineno);
  };
</script>
</body>
</html>
