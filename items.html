<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sales - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #000; --accent: #10b981; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: var(--bg); color: #1e293b; min-height: 100vh; }
        body.dark { background: #0f172a; color: #f1f5f9; }

        .app { display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Customization */
        .sidebar { 
            width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; 
            padding: 30px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; transition: 0.4s; z-index: 1000; 
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }

        .profile { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .logo { width: 45px; height: 45px; border-radius: 12px; }
        
        .menu { list-style: none; flex-grow: 1; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; transition: 0.2s; 
            margin-bottom: 4px; font-size: 14px; color: #64748b; font-weight: 600;
        }
        .menu li.active { background: var(--primary); color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Main Content */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; padding-bottom: 100px; }
        
        /* New Back Button Style */
        .back-btn { 
            background: #fff; border: 1px solid #e2e8f0; width: 40px; height: 40px; 
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; margin-right: 15px; color: #1e293b;
        }
        body.dark .back-btn { background: #1e293b; border-color: #334155; color: #fff; }

        /* Category Chips */
        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0 25px; scrollbar-width: none; }
        .cat-chip { 
            padding: 8px 20px; background: #fff; border: 1px solid #e2e8f0; 
            border-radius: 100px; cursor: pointer; font-size: 13px; font-weight: 600; 
            white-space: nowrap; transition: 0.2s;
        }
        .cat-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        body.dark .cat-chip { background: #1e293b; border-color: #334155; }

        /* Search Bar */
        .search-container { position: sticky; top: 0; background: var(--bg); z-index: 10; padding-bottom: 15px; }
        .search-input { position: relative; width: 100%; max-width: 500px; }
        .search-input input { 
            width: 100%; padding: 15px 15px 15px 50px; border-radius: 18px; 
            border: 1px solid #e2e8f0; outline: none; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        body.dark .search-input input { background: #1e293b; border-color: #334155; color: #fff; }
        .search-input i { position: absolute; left: 20px; top: 18px; color: #94a3b8; }

        /* Items Grid */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .item-card { 
            background: #fff; border-radius: 24px; border: 1px solid #e2e8f0; 
            overflow: hidden; transition: 0.3s ease; position: relative;
        }
        body.dark .item-card { background: #1e293b; border-color: #334155; }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        .img-container { width: 100%; height: 150px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-info { padding: 15px; }
        .card-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-tag { color: var(--accent); font-size: 18px; font-weight: 800; display: block; margin-bottom: 12px; }

        .btn-add-bill { 
            width: 100%; background: var(--primary); color: #fff; border: none; 
            padding: 12px; border-radius: 14px; font-weight: 700; cursor: pointer; 
            font-size: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-add-bill:active { transform: scale(0.95); }
        body.dark .btn-add-bill { background: #f8fafc; color: #000; }

        /* Floating Cart */
        .floating-cart { 
            position: fixed; bottom: 30px; right: 30px; background: var(--primary); 
            color: #fff; width: 65px; height: 65px; border-radius: 22px; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 100; 
        }
        body.dark .floating-cart { background: #f8fafc; color: #000; }
        .cart-count { 
            position: absolute; top: -5px; right: -5px; background: #ef4444; 
            color: white; font-size: 11px; padding: 4px 8px; border-radius: 10px; font-weight: 800; border: 2px solid var(--bg);
        }

        @media(max-width: 768px){ 
            .sidebar { display: none; } 
            .content { margin-left: 0; padding: 20px; } 
            .items-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="profile">
            <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
            <div><h4 style="font-size: 14px;">Surjya Bakery</h4><p style="font-size: 11px; opacity: 0.6;">Sales Terminal</p></div>
        </div>
        <ul class="menu">
            <li onclick="goPage('dashboard.html')"><i class="fa-solid fa-house"></i> Dashboard</li>
            <li class="active"><i class="fa-solid fa-cookie-bite"></i> Items</li>
            <li onclick="goPage('inventory.html')"><i class="fa-solid fa-boxes-stacked"></i> Inventory</li>
            <li onclick="goPage('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
            <li onclick="goPage('invoice.html')"><i class="fa-solid fa-file-invoice"></i> Invoice</li>
        </ul>
    </aside>

    <main class="content">
        <div class="search-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="display: flex; align-items: center;">
                    <button class="back-btn" onclick="goPage('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
                    <h2 style="font-weight: 800; letter-spacing: -1px;">Digital Menu</h2>
                </div>
                <div id="liveClock" style="font-size: 12px; font-weight: 600; opacity: 0.5;"></div>
            </div>
            
            <div class="search-input">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search delicious items..." oninput="fetchItems()">
            </div>
        </div>

        <div class="category-scroll">
            <div class="cat-chip active" onclick="filterCategory('All', this)">All Items</div>
            <div class="cat-chip" onclick="filterCategory('Bakery', this)">Bakery</div>
            <div class="cat-chip" onclick="filterCategory('Cakes', this)">Cakes</div>
            <div class="cat-chip" onclick="filterCategory('Drinks', this)">Drinks</div>
            <div class="cat-chip" onclick="filterCategory('General', this)">General</div>
        </div>

        <div class="items-grid" id="list"></div>
    </main>
</div>

<div class="floating-cart" onclick="goPage('cart.html')">
    <i class="fa-solid fa-basket-shopping"></i>
    <div class="cart-count" id="cartCount">0</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentCategory = "All";

    window.onload = () => {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        fetchItems();
        updateCartCount();
        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    };

    function filterCategory(cat, el) {
        currentCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        fetchItems();
    }

    function fetchItems() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        db.collection("inventory").orderBy("name").onSnapshot(snap => {
            const list = document.getElementById("list");
            list.innerHTML = "";
            snap.forEach(doc => {
                const item = doc.data();
                const matchesSearch = item.name.toLowerCase().includes(query);
                const matchesCat = currentCategory === "All" || item.category === currentCategory;

                if(matchesSearch && matchesCat) {
                    const card = document.createElement("div");
                    card.className = "item-card";
                    card.innerHTML = `
                        <div class="img-container" onclick="goPage('item-details.html?id=${doc.id}')">
                            ${item.photo ? `<img src="${item.photo}">` : `<i class="fa-solid fa-cookie" style="opacity:0.1; font-size:50px;"></i>`}
                        </div>
                        <div class="card-info">
                            <h3>${item.name}</h3>
                            <span class="price-tag">₹${item.price}</span>
                            <button class="btn-add-bill" onclick="addToCart('${doc.id}', '${item.name}', ${item.price})">
                                <i class="fa-solid fa-cart-plus"></i> ADD TO BILL
                            </button>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
        });
    }

    function addToCart(id, name, price) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const existing = cart.find(i => i.id === id);
        if(existing) existing.qty++; else cart.push({id, name, price, qty: 1});
        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
        
        // Haptic feedback feel (vibration for mobile)
        if (window.navigator.vibrate) window.navigator.vibrate(50);
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.reduce((s, i) => s + i.qty, 0);
    }

    function goPage(p) { window.location.href = p; }
</script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error:", message, "at", source, lineno);
    };
</script>

</body>
</html>
