<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Item Details - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f8f5f0; --card-bg: #ffffff; --border: #ede8df;
            --text: #1a1208; --sub: #9c8e7a; --accent: #c8860a; --accent-light: #fff8ed;
            --success: #16a34a; --success-bg: #dcfce7;
            --danger: #dc2626; --danger-bg: #fee2e2;
            --warn: #d97706; --warn-bg: #fef9c3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { overflow-x: hidden; overscroll-behavior-y: contain; }
        img, svg, table, video, canvas { max-width: 100%; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; align-items: flex-start; padding: 28px 16px 60px; transition: background 0.3s; overflow-x: hidden; }
        body.dark { --bg: #0f1117; --card-bg: #1a1d27; --border: #2a2d3a; --text: #f0ece4; --sub: #6b6558; --accent-light: #1e1a10; }

        .page { width: 100%; max-width: 420px; }

        /* Back header */
        .back-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .back-btn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); transition: all 0.2s; }
        .back-btn:hover { border-color: var(--accent); }
        .back-header h2 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); }

        /* Status badge */
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 16px; }

        /* Card */
        .detail-card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }

        .item-img { width: 100%; height: 180px; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .item-img img { width: 100%; height: 100%; object-fit: cover; }
        .item-img i { font-size: 60px; opacity: 0.12; }

        .item-info { padding: 20px; }
        .item-info h1 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 4px; }
        .item-price { font-size: 20px; font-weight: 700; color: var(--accent); }
        .item-category { font-size: 12px; color: var(--sub); margin-top: 4px; }

        /* Section label */
        .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--sub); font-weight: 700; display: block; margin: 0 0 10px; }

        /* Stock controller */
        .stock-card { background: var(--card-bg); border-radius: 18px; border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }
        .stock-controls { display: flex; align-items: center; justify-content: space-between; }
        .stock-btn { width: 52px; height: 52px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .stock-btn:hover { border-color: var(--accent); background: var(--accent-light); }
        .stock-btn:active { transform: scale(0.92); }
        .stock-val { font-size: 42px; font-weight: 800; color: var(--text); }

        /* Edit form */
        .edit-card { background: var(--card-bg); border-radius: 18px; border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; display: none; }
        .edit-card.visible { display: block; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
        .form-group label { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.7px; }
        .form-group input { padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; transition: all 0.2s; }
        .form-group input:focus { border-color: var(--accent); background: var(--accent-light); }

        /* Buttons */
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-full { grid-column: 1/-1; }
        .btn { padding: 13px 16px; border: none; border-radius: 13px; font-size: 13.5px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: opacity 0.2s; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--text); color: #fff; }
        .btn-primary:hover { opacity: 0.85; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-edit  { background: var(--warn-bg); color: var(--warn); }
        .btn-delete { background: var(--danger-bg); color: var(--danger); }

        /* Delete modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); padding: 28px; border-radius: 22px; width: 90%; max-width: 300px; text-align: center; border: 1px solid var(--border); }
        .modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .modal-card p  { font-size: 13px; color: var(--sub); margin-bottom: 22px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn  { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; }
        .mbtn-confirm { background: var(--danger); color: #fff; }
        .mbtn-cancel  { background: var(--border); color: var(--text); }

        .pulse { animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.45; } }
    
/* ═══════════════════════════════════════════
   GLOBAL CSS CONSISTENCY FIX
   Applied to all pages
═══════════════════════════════════════════ */

/* ── 1. Typography scale — standardize ── */
.page-title, .welcome-msg { font-size: 21px !important; }
.section-label { font-size: 11px !important; letter-spacing: 0.9px !important; }
.card-info p, .stat-card p, .sum-stat p { font-size: 11px !important; letter-spacing: 0.5px !important; }
.card-info h3, .stat-card h3 { font-size: 20px !important; }

/* ── 2. Border-radius — standardize ── */
/* Cards */
.card, .settings-card, .stat-card, .inv-card,
.emp-card, .order-card, .item-card, .customer-card,
.record-card, .detail-card, .stock-card, .prod-card,
.login-card, .activity-card, .txn-card, .balance-card,
.summary-card, .alert-card { border-radius: 18px !important; }

/* Modals */
.modal-card, .confirm-card, .logout-card { border-radius: 20px !important; }
.modal-sheet, .detail-sheet { border-radius: 22px 22px 0 0 !important; }

/* Inputs */
input[type="text"], input[type="number"],
input[type="tel"], input[type="password"],
select, .entry-input, .phone-input,
.search-wrap input, .reset-input { border-radius: 12px !important; }

/* Buttons */
.btn-primary, .btn-save, .btn-submit, .btn-create,
.btn-print, .btn-wa-share, .btn-add, .btn-add-staff,
.btn-add-item, .btn-export, .btn-outline,
.btn-gave, .btn-got, .btn-settle, .btn-verify,
.btn-restock, .btn-use, .btn-next, .btn-view,
.act-btn, .action-chip, .checkout-btn,
.conf-btn, .modal-btn { border-radius: 12px !important; }

/* Small buttons / icon buttons */
.icon-btn, .del-btn, .del-txn, .act-icon,
.back-btn, .close-btn, .dark-btn { border-radius: 10px !important; }

/* Chips / pills */
.cat-chip, .tab, .chip, .badge,
.status-pill, .stock-badge { border-radius: 8px !important; }

/* FAB */
.fab, .fab-cart { border-radius: 16px !important; }

/* ── 3. Button padding — consistent touch targets ── */
.btn-primary, .btn-save, .btn-submit, .btn-create,
.btn-print, .btn-wa-share, .btn-verify,
.checkout-btn { padding: 14px 20px !important; font-size: 14px !important; }

.btn-add, .btn-add-staff, .btn-add-item,
.btn-export, .action-chip { padding: 11px 18px !important; font-size: 13px !important; }

.btn-gave, .btn-got, .btn-use, .btn-restock,
.btn-settle, .btn-advance, .btn-attend-off,
.btn-attend-on { padding: 12px 10px !important; font-size: 12.5px !important; }

.conf-btn, .modal-btn { padding: 13px !important; font-size: 13.5px !important; }

/* ── 4. Icon button size — consistent ── */
.icon-btn, .act-icon, .back-btn, .dark-btn {
    width: 38px !important;
    height: 38px !important;
    min-width: 38px !important;
}

/* ── 5. FAB — consistent size ── */
.fab, .fab-cart {
    width: 52px !important;
    height: 52px !important;
    font-size: 18px !important;
    bottom: 24px !important;
    right: 24px !important;
}

/* ── 6. Input padding — consistent ── */
input[type="text"], input[type="number"],
input[type="tel"], input[type="password"],
select, .entry-input, .search-wrap input {
    padding: 12px 14px !important;
    font-size: 14px !important;
}

/* ── 7. Card padding — consistent ── */
.card { padding: 18px 20px !important; }
.settings-card { padding: 22px !important; }
.stat-card { padding: 16px 18px !important; }
.inv-card, .order-card, .emp-card,
.customer-card, .record-card { padding: 18px 20px !important; }

/* ── 8. Menu item height — consistent ── */
.menu li {
    padding: 11px 14px !important;
    font-size: 13.5px !important;
    border-radius: 12px !important;
}

/* ── 9. Badge sizes — consistent ── */
.badge { padding: 4px 10px !important; font-size: 11px !important; border-radius: 8px !important; }
.stock-badge { padding: 3px 8px !important; font-size: 10.5px !important; }

/* ── 10. Section label spacing ── */
.section-label { margin-bottom: 12px !important; margin-top: 4px !important; }

/* ── 11. Modal sheet consistent padding ── */
.modal-sheet { padding: 26px 22px 36px !important; }
.confirm-card { padding: 26px 22px !important; }

            /* input-zoom-fix: iOS zoom prevention */
        input, select, textarea { font-size: 16px !important; }
    </style>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
<div class="page">

    <!-- Back header -->
    <div class="back-header">
        <button class="back-btn" onclick="goPage('items.html')"><i class="fa-solid fa-chevron-left"></i></button>
        <h2>Item Details</h2>
    </div>

    <!-- Status badge -->
    <div id="statusBadge" class="status-badge" style="background:var(--warn-bg); color:var(--warn);">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading...
    </div>

    <!-- Image + Info card -->
    <div class="detail-card">
        <div class="item-img" id="itemImg">
            <i class="fa-solid fa-cookie-bite"></i>
        </div>
        <div class="item-info">
            <h1 id="itemName">—</h1>
            <div class="item-price" id="itemPrice">₹ 0</div>
            <div class="item-category" id="itemCategory"></div>
        </div>
    </div>

    <!-- Edit Form (hidden by default) -->
    <div class="edit-card" id="editCard">
        <span class="section-label">Edit Details</span>
        <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="inputName" placeholder="Item Name">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="inputPrice" placeholder="0" inputmode="numeric">
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="inputCategory" placeholder="e.g. Bakery">
            </div>
        </div>
    </div>

    <!-- Stock Control -->
    <div class="stock-card">
        <span class="section-label">Stock Level</span>
        <div class="stock-controls">
            <button class="stock-btn" onclick="changeStock(-1)"><i class="fa-solid fa-minus"></i></button>
            <span class="stock-val" id="stockVal">0</span>
            <button class="stock-btn" onclick="changeStock(1)"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-row">
        <button class="btn btn-primary btn-full" id="saveBtn" onclick="saveData()">
            <i class="fa-solid fa-cloud-arrow-up"></i> Save Changes
        </button>
        <button class="btn btn-edit"   id="editToggleBtn" onclick="toggleEdit()">
            <i class="fa-solid fa-pen"></i> Edit Details
        </button>
        <button class="btn btn-delete" onclick="openDeleteModal()">
            <i class="fa-solid fa-trash-can"></i> Delete
        </button>
    </div>

</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
        <div style="width:56px;height:56px;background:var(--danger-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
            <i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);font-size:22px;"></i>
        </div>
        <h3>Delete Item?</h3>
        <p>Yeh action permanent hai. Item wapas nahi aayega.</p>
        <div class="modal-btns">
            <button class="modal-btn mbtn-cancel"  onclick="closeDeleteModal()">Cancel</button>
            <button class="modal-btn mbtn-confirm" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem("loggedIn") !== "true") window.location.replace("index.html");

    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        console.warn("Offline mode not available:", err.code); // multiple tabs / unsupported browser
    });

    // Dark mode
    if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    if (!itemId) goPage("items.html");

    let itemData     = null;
    let currentStock = 0;
    let isEditing    = false;

    // FIX: use "items" collection (not "inventory")
    db.collection("items").doc(itemId).onSnapshot(doc => {
        if (!doc.exists) return goPage("items.html");
        itemData = doc.data();
        if (!isEditing) {
            currentStock = parseFloat(itemData.stock ?? 0);
            renderUI();
        }
    });

    function renderUI() {
        document.getElementById("itemName").innerText     = itemData.name;
        document.getElementById("itemPrice").innerText    = "₹ " + parseFloat(itemData.price || 0).toLocaleString();
        document.getElementById("itemCategory").innerText = itemData.category ? "📁 " + itemData.category : "";
        document.getElementById("stockVal").innerText     = currentStock;

        if (itemData.photo) {
            document.getElementById("itemImg").innerHTML = `<img src="${itemData.photo}" alt="${itemData.name}">`;
        }

        const isLow = currentStock < 10;
        const badge = document.getElementById("statusBadge");
        badge.className = "status-badge";
        if (isLow) {
            badge.style.background = "var(--danger-bg)"; badge.style.color = "var(--danger)";
            badge.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Low Stock";
        } else {
            badge.style.background = "var(--success-bg)"; badge.style.color = "var(--success)";
            badge.innerHTML = "<i class='fa-solid fa-circle-check'></i> Stock Healthy";
        }
    }

    function changeStock(n) {
        currentStock = Math.max(0, currentStock + n);
        document.getElementById("stockVal").innerText = currentStock;
    }

    function toggleEdit() {
        isEditing = !isEditing;
        const editCard = document.getElementById("editCard");
        const btn      = document.getElementById("editToggleBtn");

        if (isEditing) {
            editCard.classList.add("visible");
            document.getElementById("inputName").value     = itemData.name;
            document.getElementById("inputPrice").value    = itemData.price;
            document.getElementById("inputCategory").value = itemData.category || "";
            btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Cancel Edit';
            btn.style.background = "var(--danger-bg)";
            btn.style.color = "var(--danger)";
        } else {
            editCard.classList.remove("visible");
            btn.innerHTML = '<i class="fa-solid fa-pen"></i> Edit Details';
            btn.style.background = "var(--warn-bg)";
            btn.style.color = "var(--warn)";
        }
    }

    async function saveData() {
        const btn     = document.getElementById("saveBtn");
        const newName = isEditing ? document.getElementById("inputName").value.trim() : itemData.name;
        const newPrice= isEditing ? parseFloat(document.getElementById("inputPrice").value) || 0 : itemData.price;
        const newCat  = isEditing ? document.getElementById("inputCategory").value.trim() : itemData.category;

        if (!newName) return alert("Item ka naam daalna zaroori hai.");

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

        try {
            await db.collection("items").doc(itemId).update({
                name: newName, price: newPrice, stock: currentStock,
                category: newCat,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });
            btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Saved!';
            setTimeout(() => goPage("items.html"), 700);
        } catch (e) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Changes';
            alert("Error: " + e.message);
        }
    }

    function openDeleteModal()  { document.getElementById("deleteModal").classList.add("active"); }
    function closeDeleteModal() { document.getElementById("deleteModal").classList.remove("active"); }

    async function confirmDelete() {
        await db.collection("items").doc(itemId).delete();
        goPage("items.html");
    }

    function goPage(p) { window.location.href = p; }
    window.onerror = (m, s, l) => console.error(m, s, l);
</script>
    <script src="animations.js" defer></script>
<script src="pwa-install.js" defer></script>
</body>
</html>
