<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Checkout - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; transition: 0.3s; }
        body.dark { background: #0f172a; color: #f1f5f9; }
        .app { display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: #fff; border-right: 1px solid #e2e8f0; padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100%; z-index: 1000; }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }
        .logo { width: 45px; height: 45px; border-radius: 12px; margin-bottom: 30px; cursor: pointer; }
        .menu li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; margin-bottom: 4px; font-size: 14px; color: #64748b; font-weight: 500; }
        .menu li.active { background: #000; color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; padding-bottom: 220px; }
        .top-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-btn { background: #fff; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        body.dark .back-btn { background: #1e293b; border-color: #334155; color: #fff; }

        /* Cart & Form */
        .card { background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; }
        body.dark .card { background: #1e293b; border-color: #334155; }
        .cart-item { background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        body.dark .cart-item { background: #1e293b; border-color: #334155; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { width: 100%; max-width: 350px; background: #fff; border-radius: 28px; padding: 30px; text-align: center; }
        body.dark .modal-content { background: #1e293b; color: #fff; }
        .btn-modal { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; margin-top: 20px; background: #000; color: #fff; }
        body.dark .btn-modal { background: #fff; color: #000; }

        /* Footer */
        .cart-footer { position: fixed; bottom: 0; right: 0; left: 260px; background: #fff; padding: 20px 40px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        body.dark .cart-footer { background: #1e293b; border-color: #334155; }
        .btn-checkout { background: #10b981; color: white; padding: 16px 35px; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 16px; }

        /* Utils */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        select, input { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; color: inherit; }
        body.dark select, body.dark input { background: #0f172a; border-color: #334155; }
        label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #94a3b8; margin-bottom: 6px; display: block; }

        @media(max-width: 768px){
            .sidebar{ display: none; }
            .content{ margin-left: 0; padding: 20px; padding-bottom: 180px; }
            .cart-footer { left: 0; padding: 20px; flex-direction: column; gap: 15px; }
            .btn-checkout { width: 100%; }
        }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo" onclick="go('dashboard.html')">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-house"></i> Dashboard</li>
            <li onclick="go('items.html')"><i class="fa-solid fa-cookie"></i> Items</li>
            <li class="active" onclick="go('checkout.html')"><i class="fa-solid fa-cart-shopping"></i> Checkout</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Khatabook</li>
            <li onclick="showLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <button class="back-btn" onclick="go('items.html')"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 style="font-weight: 800;">Review Order</h2>
        </header>

        <div id="orderSettings" class="card" style="display: none;">
            <div class="form-row">
                <div>
                    <label>Customer Name</label>
                    <select id="customerSelect"></select>
                </div>
                <div>
                    <label>Payment Method</label>
                    <select id="paymentMode">
                        <option value="Cash">Cash Payment</option>
                        <option value="Online">Online / UPI</option>
                        <option value="Due">Udhaar (Due)</option>
                    </select>
                </div>
            </div>
            <div>
                <label>Add Order Note</label>
                <input type="text" id="orderNote" placeholder="e.g. Packing instruction...">
            </div>
        </div>

        <div id="cartContainer"></div>

        <div id="summarySection" class="card" style="display: none; border-style: dashed;">
            <div class="summary-line" style="display:flex; justify-content: space-between;"><span>Sub Total:</span><span id="subTotal">₹ 0</span></div>
            <div class="summary-line" style="margin-top:10px; display:flex; justify-content: space-between; align-items:center;">
                <span>Discount (₹):</span>
                <input type="number" id="discountVal" value="0" min="0" oninput="calculateTotal()" style="width: 80px; text-align: right;">
            </div>
            <div style="background:rgba(16, 185, 129, 0.1); padding:15px; border-radius:12px; margin-top:15px; display:flex; justify-content: space-between; font-weight:800; color:#10b981;">
                <span>Final Amount:</span>
                <span id="finalDisplay">₹ 0</span>
            </div>
        </div>
    </main>

    <footer class="cart-footer" id="cartFooter" style="display: none;">
        <div>
            <p style="font-size: 11px; font-weight: 700; color: #94a3b8;">TOTAL PAYABLE</p>
            <h2 id="grandTotalDisplay" style="font-size: 28px; font-weight: 900;">₹ 0</h2>
        </div>
        <button class="btn-checkout" id="checkoutBtn" onclick="placeOrder()">PLACE ORDER <i class="fa-solid fa-arrow-right" style="margin-left:10px;"></i></button>
    </footer>
</div>

<div class="modal" id="successModal">
    <div class="modal-content">
        <i class="fa-solid fa-circle-check" style="font-size: 50px; color: #10b981; margin-bottom: 15px;"></i>
        <h3 style="font-weight: 900;">Order Success!</h3>
        <p style="opacity: 0.6; margin-top: 5px;">Aapka order record ho gaya hai.</p>
        <button class="btn-modal" onclick="go('records.html')">VIEW RECORDS</button>
    </div>
</div>

<div class="modal" id="logoutModal">
    <div class="modal-content">
        <h3 style="font-weight: 900;">Logout karein?</h3>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-modal" style="background:#f1f5f9; color:#000;" onclick="closeModals()">BACK</button>
            <button class="btn-modal" style="background:#ef4444; color:#fff;" onclick="go('login.html')">LOGOUT</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    function showLogout() { showModal('logoutModal'); }

    async function placeOrder() {
        if(cart.length === 0) return alert("Cart khali hai!");

        const btn = document.getElementById("checkoutBtn");
        btn.disabled = true;
        btn.innerText = "Processing...";

        const customer = document.getElementById("customerSelect").value;
        const mode = document.getElementById("paymentMode").value;
        const note = document.getElementById("orderNote").value;
        const amount = calculateTotal();

        const orderId = "ORD-" + Date.now();
        const newOrder = {
            orderId, 
            date: new Date().toLocaleString('en-IN'),
            customer, 
            items: [...cart], 
            total: amount, 
            mode, 
            note,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // 1. Order save karein
            await db.collection("orders").doc(orderId).set(newOrder);
            
            // Fix A: Alignment with Dashboard/Customer Portal Ledger system
            if(mode === "Due" && customer !== "Walking Customer") {
                await db.collection("ledger").add({
                    name: customer, 
                    balance: amount, // 'balance' name use kiya jo upni collect calculation se maps hai
                    note: "Order: " + orderId,
                    date: new Date().toLocaleDateString('en-IN'),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            
            cart = [];
            localStorage.setItem("cart", JSON.stringify(cart));
            showModal('successModal');
        } catch (error) {
            console.error("Order error:", error);
            btn.disabled = false;
            btn.innerText = "RETRY ORDER";
            alert("Order save karne mein dikkat aayi. Fir se koshish karein.");
        }
    }

    function calculateTotal() {
        let sub = cart.reduce((s, i) => s + (parseFloat(i.price || 0) * parseInt(i.qty || 0)), 0);
        let inputDisc = parseFloat(document.getElementById("discountVal").value);
        
        // Fix C: Prevent Negative value input bypass crash
        let disc = isNaN(inputDisc) || inputDisc < 0 ? 0 : inputDisc;
        let total = Math.max(0, sub - disc);

        document.getElementById("subTotal").innerText = "₹ " + sub.toLocaleString('en-IN');
        document.getElementById("grandTotalDisplay").innerText = "₹ " + total.toLocaleString('en-IN');
        document.getElementById("finalDisplay").innerText = "₹ " + total.toLocaleString('en-IN');
        return total;
    }

    // Fix B: Live Fetch clients direct from Cloud Firestore sync list
    function loadClientsDropdown() {
        const custSelect = document.getElementById("customerSelect");
        if(!custSelect) return;

        db.collection("clients").onSnapshot(snap => {
            custSelect.innerHTML = '<option value="Walking Customer">Walking Customer</option>';
            snap.forEach(doc => {
                const c = doc.data();
                if(c.name) {
                    custSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`;
                }
            });
        });
    }

    function renderCart() {
        const container = document.getElementById("cartContainer");
        const footer = document.getElementById("cartFooter");
        const summary = document.getElementById("summarySection");
        const settings = document.getElementById("orderSettings");
        
        container.innerHTML = "";
        if (cart.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding-top:100px; color:#94a3b8;"><i class="fa-solid fa-cart-arrow-down" style="font-size:48px; margin-bottom:15px;"></i><h3>Cart is empty</h3></div>`;
            footer.style.display="none"; summary.style.display="none"; settings.style.display="none";
            return;
        }

        footer.style.display="flex"; summary.style.display="block"; settings.style.display="block";
        
        // Safe calling async updated clients data list map
        loadClientsDropdown();

        cart.forEach((item, i) => {
            const itemPrice = parseFloat(item.price) || 0;
            const itemQty = parseInt(item.qty) || 0;
            container.innerHTML += `
                <div class="cart-item">
                    <div>
                        <h4 style="font-weight:700;">${item.name || 'Bakery Product'}</h4>
                        <p style="font-size:12px; opacity:0.6;">₹${itemPrice.toLocaleString('en-IN')} x ${itemQty}</p>
                    </div>
                    <i class="fa-solid fa-trash-can" style="color:#ef4444; cursor:pointer;" onclick="remove(${i})"></i>
                </div>`;
        });
        calculateTotal();
    }

    function remove(i) { cart.splice(i, 1); localStorage.setItem("cart", JSON.stringify(cart)); renderCart(); }
    function go(p) { window.location.href = p; }

    window.onload = () => {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        renderCart();
    };
</script>
</body>
</html>
