<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Orders Cloud - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
        body.dark { background: #0f172a; color: #f1f5f9; }

        .app { display: flex; height: 100vh; }

        /* Sidebar - Brand Consistent */
        .sidebar { 
            width: 260px; background: #fff; border-right: 1px solid #e2e8f0; 
            padding: 25px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; z-index: 1000;
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }
        .logo { width: 45px; height: 45px; border-radius: 12px; margin-bottom: 30px; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; transition: 0.2s; 
            margin-bottom: 5px; font-size: 14px; color: #64748b; font-weight: 500;
        }
        .menu li.active { background: #000; color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; }
        
        .top-header { margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .stat-box { background: #fff; padding: 15px; border-radius: 20px; border: 1px solid #e2e8f0; text-align: center; }
        body.dark .stat-box { background: #1e293b; border-color: #334155; }
        .stat-box small { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .stat-box h3 { font-size: 18px; font-weight: 900; }

        /* Filter Tabs */
        .tabs { display: flex; gap: 10px; margin: 25px 0; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tab { 
            padding: 10px 20px; border-radius: 50px; background: #fff; border: 1px solid #e2e8f0;
            font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        body.dark .tab { background: #1e293b; border-color: #334155; }
        .tab.active { background: #000; color: #fff; border-color: #000; }
        body.dark .tab.active { background: #fff; color: #000; }

        /* Order Cards */
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { 
            background: #fff; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0;
            transition: 0.3s; position: relative;
        }
        body.dark .order-card { background: #1e293b; border-color: #334155; }
        
        .order-id { font-weight: 900; font-size: 15px; }
        .order-time { font-size: 11px; color: #94a3b8; font-weight: 600; }
        .order-total { font-size: 26px; font-weight: 900; margin: 12px 0; }

        .status-pill { padding: 6px 12px; border-radius: 50px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .pending { background: #fff7ed; color: #f59e0b; }
        .preparing { background: #eff6ff; color: #3b82f6; }
        .delivered { background: #f0fdf4; color: #10b981; }

        .action-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .act-btn { padding: 10px; border-radius: 12px; border: none; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .act-btn:active { transform: scale(0.95); }
        .btn-view { background: #f1f5f9; color: #64748b; }
        .btn-next { background: #000; color: #fff; }
        body.dark .btn-next { background: #fff; color: #000; }
        .btn-wa { background: #25d366; color: #fff; }

        /* Invoice Modal */
        .modal { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; padding: 20px; 
            backdrop-filter: blur(5px);
        }
        .modal-body { 
            background: #fff; color: #000; width: 100%; max-width: 380px; 
            border-radius: 30px; padding: 30px; position: relative;
        }
        .invoice-hr { border: none; border-top: 2px dashed #e2e8f0; margin: 15px 0; }

        @media(max-width: 768px){ .sidebar{ display: none; } .content{ margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-house"></i> Dashboard</li>
            <li onclick="go('inventory.html')"><i class="fa-solid fa-boxes-stacked"></i> Inventory</li>
            <li class="active"><i class="fa-solid fa-cloud-arrow-down"></i> Cloud Orders</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <h2 style="font-weight: 900; font-size: 26px; letter-spacing: -1px;">Orders Manager</h2>
            <div class="stats-grid">
                <div class="stat-box"><small>Total Orders</small><h3 id="statToday">0</h3></div>
                <div class="stat-box"><small>Active</small><h3 id="statPending" style="color:var(--warning)">0</h3></div>
                <div class="stat-box"><small>Revenue</small><h3 id="statTotal">₹0</h3></div>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="filterBy('All', this)">ALL ORDERS</div>
            <div class="tab" onclick="filterBy('Pending', this)">PENDING</div>
            <div class="tab" onclick="filterBy('Preparing', this)">PREPARING</div>
            <div class="tab" onclick="filterBy('Delivered', this)">DELIVERED</div>
        </div>

        <div class="orders-grid" id="ordersList"></div>
    </main>
</div>

<div id="invoiceModal" class="modal">
    <div class="modal-body">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="font-weight: 900;">SURJYA BAKERY</h2>
            <p id="invId" style="font-size: 12px; color: #64748b;"></p>
        </div>
        <div id="invItems" style="font-size: 14px;"></div>
        <hr class="invoice-hr">
        <div style="display:flex; justify-content:space-between; font-weight:900; font-size: 20px;">
            <span>TOTAL</span><span id="invTotal"></span>
        </div>
        <button onclick="closeInvoice()" style="width:100%; margin-top:25px; padding:15px; border-radius:15px; border:none; background:#f1f5f9; font-weight:800; cursor:pointer;">CLOSE</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentFilter = "All";

    function init() {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snap => render(snap));
    }

    function render(snap) {
        const list = document.getElementById("ordersList");
        list.innerHTML = "";
        let countAll = 0, countLive = 0, totalRev = 0;

        snap.forEach(doc => {
            const o = doc.data();
            const id = doc.id;
            const status = o.status || "Pending";
            
            countAll++;
            if(status !== "Delivered") countLive++;
            totalRev += parseFloat(o.total || 0);

            if(currentFilter !== "All" && status !== currentFilter) return;

            const card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start">
                    <div>
                        <p class="order-id">#${o.orderId || id.slice(0,5)}</p>
                        <p class="order-time">${o.date || 'Today'}</p>
                    </div>
                    <span class="status-pill ${status.toLowerCase()}">${status}</span>
                </div>
                <h2 class="order-total">₹${o.total}</h2>
                <div class="action-row">
                    <button class="act-btn btn-view" onclick="viewInv('${id}')">VIEW</button>
                    <button class="act-btn btn-next" onclick="nextStep('${id}', '${status}')">NEXT</button>
                    <button class="act-btn btn-wa" onclick="sendWhatsApp('${id}')"><i class="fa-brands fa-whatsapp"></i></button>
                </div>
                <p onclick="deleteOrder('${id}')" style="font-size:10px; text-align:center; margin-top:15px; opacity:0.3; cursor:pointer">Cancel Order</p>
            `;
            list.appendChild(card);
        });

        document.getElementById("statToday").innerText = countAll;
        document.getElementById("statPending").innerText = countLive;
        document.getElementById("statTotal").innerText = "₹" + totalRev.toLocaleString();
    }

    async function nextStep(id, current) {
        const steps = ["Pending", "Preparing", "Delivered"];
        let next = steps[(steps.indexOf(current) + 1) % steps.length];
        await db.collection("orders").doc(id).update({ status: next });
    }

    function filterBy(status, el) {
        currentFilter = status;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        db.collection("orders").get().then(snap => render(snap));
    }

    async function viewInv(id) {
        const doc = await db.collection("orders").doc(id).get();
        const o = doc.data();
        document.getElementById("invId").innerText = "ORDER ID: #" + (o.orderId || id.slice(0,5));
        document.getElementById("invTotal").innerText = "₹" + o.total;
        
        let items = (o.items || []).map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:8px"><span>${i.name} x ${i.qty}</span><span>₹${i.price}</span></div>`).join('');
        document.getElementById("invItems").innerHTML = items || '<p style="text-align:center">No items found</p>';
        
        document.getElementById("invoiceModal").style.display = "flex";
    }

    function sendWhatsApp(id) {
        db.collection("orders").doc(id).get().then(doc => {
            const o = doc.data();
            const msg = `Surjya Bakery: Hi! Your Order #${o.orderId} is now ${o.status}. Total amount: ₹${o.total}. Thank you!`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        });
    }

    async function deleteOrder(id) {
        if(confirm("Permanently cancel this order?")) await db.collection("orders").doc(id).delete();
    }

    function closeInvoice() { document.getElementById("invoiceModal").style.display = "none"; }
    function go(p) { window.location.href = p; }
    window.onload = init;
</script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error:", message, "at", source, lineno);
    };
</script>
</body>
</html>
