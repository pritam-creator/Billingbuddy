<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Orders Cloud - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #000; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --accent: #3b82f6; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: var(--bg); color: #1e293b; min-height: 100vh; transition: 0.3s; }
        body.dark { background: #0f172a; color: #f1f5f9; --bg: #0f172a; }

        .app { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar { 
            width: 260px; background: #fff; border-right: 1px solid #e2e8f0; 
            padding: 25px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; z-index: 1000; transition: 0.4s;
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }
        .logo { width: 45px; height: 45px; border-radius: 12px; margin-bottom: 30px; object-fit: cover; }
        
        .menu { list-style: none; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; transition: 0.2s; 
            margin-bottom: 5px; font-size: 14px; color: #64748b; font-weight: 600;
        }
        .menu li:hover { background: #f1f5f9; color: #000; }
        .menu li.active { background: #000; color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; padding-bottom: 80px; }
        
        .top-header { margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
        .stat-box { background: #fff; padding: 20px; border-radius: 24px; border: 1px solid #e2e8f0; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        body.dark .stat-box { background: #1e293b; border-color: #334155; }
        .stat-box small { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-box h3 { font-size: 22px; font-weight: 900; margin-top: 5px; letter-spacing: -1px; }

        /* Filter Tabs */
        .tabs { display: flex; gap: 12px; margin: 30px 0; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .tab { 
            padding: 12px 24px; border-radius: 50px; background: #fff; border: 1px solid #e2e8f0;
            font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: 0.3s; color: #64748b;
        }
        body.dark .tab { background: #1e293b; border-color: #334155; }
        .tab.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }
        body.dark .tab.active { background: #fff; color: #000; }

        /* Order Cards */
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { 
            background: #fff; border-radius: 28px; padding: 25px; border: 1px solid #e2e8f0;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
        }
        body.dark .order-card { background: #1e293b; border-color: #334155; }
        .order-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        
        .order-id { font-weight: 900; font-size: 16px; letter-spacing: -0.5px; }
        .order-time { font-size: 11px; color: #94a3b8; font-weight: 700; margin-top: 2px; }
        .order-total { font-size: 28px; font-weight: 900; margin: 15px 0; letter-spacing: -1px; color: var(--accent); }

        .status-pill { padding: 8px 14px; border-radius: 50px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .preparing { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .delivered { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        .action-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .act-btn { padding: 14px; border-radius: 16px; border: none; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .act-btn:active { transform: scale(0.92); }
        .btn-view { background: #f1f5f9; color: #64748b; }
        .btn-next { background: #000; color: #fff; }
        body.dark .btn-next { background: #fff; color: #000; }
        .btn-wa { background: #25d366; color: #fff; }

        /* Modal */
        .modal { 
            display: none; position: fixed; inset: 0; 
            background: rgba(15, 23, 42, 0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; 
            backdrop-filter: blur(10px);
        }
        .modal-body { 
            background: #fff; color: #000; width: 100%; max-width: 400px; 
            border-radius: 35px; padding: 35px; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .invoice-hr { border: none; border-top: 2px dashed #e2e8f0; margin: 20px 0; }

        @media(max-width: 768px){ .sidebar{ display: none; } .content{ margin-left: 0; padding: 20px; } .stats-grid { gap: 10px; } .stat-box { padding: 15px; } }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-house"></i> Dashboard</li>
            <li onclick="go('items.html')"><i class="fa-solid fa-cookie-bite"></i> Items</li>
            <li class="active"><i class="fa-solid fa-cloud-arrow-down"></i> Cloud Orders</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
            <li onclick="go('pos.html')"><i class="fa-solid fa-file-invoice"></i> POS</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <h2 style="font-weight: 900; font-size: 32px; letter-spacing: -1.5px;">Orders Cloud</h2>
            <div class="stats-grid">
                <div class="stat-box"><small>Total Volume</small><h3 id="statToday">0</h3></div>
                <div class="stat-box"><small>Active Now</small><h3 id="statPending" style="color:var(--warning)">0</h3></div>
                <div class="stat-box"><small>Sales Worth</small><h3 id="statTotal">₹0</h3></div>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="filterBy('All', this)">ALL ORDERS</div>
            <div class="tab" onclick="filterBy('Pending', this)">PENDING</div>
            <div class="tab" onclick="filterBy('Preparing', this)">PREPARING</div>
            <div class="tab" onclick="filterBy('Delivered', this)">DELIVERED</div>
        </div>

        <div class="orders-grid" id="ordersList"></div>
    </main>
</div>

<div id="invoiceModal" class="modal">
    <div class="modal-body">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="font-weight: 900; letter-spacing: -1px;">SURJYA BAKERY</h2>
            <p id="invId" style="font-size: 12px; color: #94a3b8; font-weight: 700; margin-top: 5px;"></p>
        </div>
        <div id="invItems" style="font-size: 14px; font-weight: 600;"></div>
        <hr class="invoice-hr">
        <div style="display:flex; justify-content:space-between; font-weight:900; font-size: 22px; letter-spacing: -1px;">
            <span>TOTAL</span><span id="invTotal" style="color: var(--accent);"></span>
        </div>
        <button onclick="closeInvoice()" style="width:100%; margin-top:30px; padding:18px; border-radius:20px; border:none; background:#f1f5f9; font-weight:800; cursor:pointer; font-size: 14px;">CLOSE VIEW</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentFilter = "All";

    function init() {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snap => render(snap));
    }

    function render(snap) {
        const list = document.getElementById("ordersList");
        list.innerHTML = "";
        let countAll = 0, countLive = 0, totalRev = 0;

        snap.forEach(doc => {
            const o = doc.data();
            const id = doc.id;
            const status = o.status || "Pending";
            
            countAll++;
            if(status !== "Delivered") countLive++;
            totalRev += parseFloat(o.total || 0);

            if(currentFilter !== "All" && status !== currentFilter) return;

            const card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start">
                    <div>
                        <p class="order-id">#${o.orderId || id.slice(0,5).toUpperCase()}</p>
                        <p class="order-time">${o.date || 'Just now'}</p>
                    </div>
                    <span class="status-pill ${status.toLowerCase()}">${status}</span>
                </div>
                <h2 class="order-total">₹${parseFloat(o.total).toLocaleString()}</h2>
                <div class="action-row">
                    <button class="act-btn btn-view" onclick="viewInv('${id}')"><i class="fa-solid fa-eye"></i> VIEW</button>
                    <button class="act-btn btn-next" onclick="nextStep('${id}', '${status}')">NEXT <i class="fa-solid fa-chevron-right"></i></button>
                    <button class="act-btn btn-wa" onclick="sendWhatsApp('${id}')"><i class="fa-brands fa-whatsapp"></i> WA</button>
                </div>
                <p onclick="deleteOrder('${id}')" style="font-size:10px; text-align:center; margin-top:20px; font-weight:800; opacity:0.2; cursor:pointer; text-transform:uppercase; letter-spacing:1px;">Cancel Order</p>
            `;
            list.appendChild(card);
        });

        document.getElementById("statToday").innerText = countAll;
        document.getElementById("statPending").innerText = countLive;
        document.getElementById("statTotal").innerText = "₹" + totalRev.toLocaleString();
    }

    async function nextStep(id, current) {
        const steps = ["Pending", "Preparing", "Delivered"];
        let nextIndex = (steps.indexOf(current) + 1);
        if(nextIndex >= steps.length) return; // Already delivered
        
        let next = steps[nextIndex];
        await db.collection("orders").doc(id).update({ status: next });
        if (window.navigator.vibrate) window.navigator.vibrate(40);
    }

    function filterBy(status, el) {
        currentFilter = status;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        db.collection("orders").orderBy("timestamp", "desc").get().then(snap => render(snap));
    }

    async function viewInv(id) {
        const doc = await db.collection("orders").doc(id).get();
        const o = doc.data();
        document.getElementById("invId").innerText = "BILLING ID: #" + (o.orderId || id.slice(0,5).toUpperCase());
        document.getElementById("invTotal").innerText = "₹" + parseFloat(o.total).toLocaleString();
        
        let items = (o.items || []).map(i => `
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid #f1f5f9; padding-bottom:8px">
                <span>${i.name} <small style="opacity:0.5">x ${i.qty}</small></span>
                <span>₹${i.price * i.qty}</span>
            </div>`).join('');
        document.getElementById("invItems").innerHTML = items || '<p style="text-align:center; opacity:0.5">No items listed</p>';
        
        document.getElementById("invoiceModal").style.display = "flex";
    }

    function sendWhatsApp(id) {
        db.collection("orders").doc(id).get().then(doc => {
            const o = doc.data();
            const msg = `Surjya Bakery Order Update: Hi! Your Order #${o.orderId || id.slice(0,5)} is now ${o.status.toUpperCase()}. Total Bill: ₹${o.total}. Thank you for choosing us!`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        });
    }

    async function deleteOrder(id) {
        if(confirm("Confirm to delete this order? This action cannot be undone.")) {
            await db.collection("orders").doc(id).delete();
        }
    }

    function closeInvoice() { document.getElementById("invoiceModal").style.display = "none"; }
    function go(p) { window.location.href = p; }
    window.onload = init;
</script>
</body>
</html>
