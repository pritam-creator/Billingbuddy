<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Master Inventory - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #000; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); color: #1e293b; min-height: 100vh; }
        body.dark { background: #0f172a; color: #f1f5f9; }

        .app { display: flex; height: 100vh; }

        /* Sidebar Customization */
        .sidebar { 
            width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; 
            padding: 25px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; z-index: 1000; 
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }
        
        .logo { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; margin-bottom: 20px; }

        .menu { list-style: none; flex-grow: 1; margin-top: 20px; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; margin-bottom: 5px; font-size: 14px; color: #64748b; font-weight: 600;
        }
        .menu li.active { background: var(--primary); color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; }
        
        /* Top Header Styling */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        .back-btn { 
            background: #fff; border: 1px solid #e2e8f0; width: 42px; height: 42px; 
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; margin-right: 15px; color: #1e293b; transition: 0.2s;
        }
        body.dark .back-btn { background: #1e293b; border-color: #334155; color: #fff; }

        /* Navigation Tabs */
        .tab-bar { display: flex; gap: 10px; background: #e2e8f0; padding: 6px; border-radius: 16px; width: fit-content; margin-bottom: 30px; }
        body.dark .tab-bar { background: #1e293b; }
        .tab { padding: 10px 25px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.3s; color: #64748b; }
        .tab.active { background: #fff; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        body.dark .tab.active { background: #334155; color: #fff; }

        /* Analytics Bar */
        .report-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 24px; border: 1px solid #e2e8f0; }
        body.dark .stat-card { background: #1e293b; border-color: #334155; }
        .stat-card p { font-size: 11px; text-transform: uppercase; font-weight: 800; color: #94a3b8; margin-bottom: 8px; }
        .stat-card h3 { font-size: 22px; font-weight: 900; }

        /* Modern Inventory Grid */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { 
            background: #fff; border-radius: 28px; padding: 25px; border: 1px solid #e2e8f0; 
            transition: 0.3s ease; position: relative;
        }
        body.dark .card { background: #1e293b; border-color: #334155; }

        .stock-display { display: flex; align-items: baseline; gap: 8px; margin: 15px 0; }
        .stock-level { font-size: 32px; font-weight: 900; }
        .unit { font-size: 14px; color: #94a3b8; font-weight: 700; }

        .progress-track { background: #f1f5f9; height: 10px; border-radius: 20px; margin: 20px 0; overflow: hidden; }
        body.dark .progress-track { background: #0f172a; }
        .progress-fill { height: 100%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 20px; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .qty-btn { 
            flex: 1; padding: 14px; border-radius: 16px; border: none; 
            cursor: pointer; font-weight: 800; font-size: 15px; transition: 0.2s;
        }
        .minus { background: #fee2e2; color: #ef4444; }
        .plus { background: #dcfce7; color: #10b981; }

        .export-btn { background: var(--primary); color: #fff; padding: 12px 20px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        body.dark .export-btn { background: #fff; color: #000; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 22px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; }
        body.dark .fab { background: #f8fafc; color: #000; }

        /* MODAL STYLING */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 28px; }
        body.dark .modal-content { background: #1e293b; color: #fff; }
        .modal-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; margin-bottom: 15px; outline: none; font-size: 14px; }
        body.dark .modal-input { background: #0f172a; border-color: #334155; color: #fff; }
        .modal-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; margin-top: 5px; }

        @media(max-width: 768px){ 
            .sidebar{ display: none; } 
            .content{ margin-left: 0; padding: 20px; } 
            .report-bar { grid-template-columns: 1fr 1fr; }
            .inventory-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
            <li onclick="go('items.html')"><i class="fa-solid fa-cookie-bite"></i> Items</li>
            <li class="active"><i class="fa-solid fa-boxes-stacked"></i> Inventory</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <div style="display: flex; align-items: center;">
                <button class="back-btn" onclick="go('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
                <div>
                    <h1 style="font-weight: 900; letter-spacing: -1.5px; font-size: 32px;">Warehouse</h1>
                    <p style="font-size: 13px; font-weight: 600; opacity: 0.5;">Manage your stocks & raw materials</p>
                </div>
            </div>
            <button class="export-btn" onclick="downloadReport()">
                <i class="fa-solid fa-file-arrow-down"></i> Export
            </button>
        </header>

        <div class="tab-bar">
            <div class="tab active" id="tabBakery" onclick="switchTab('Bakery')">FINISHED PRODUCTS</div>
            <div class="tab" id="tabRaw" onclick="switchTab('Raw')">RAW MATERIALS</div>
        </div>

        <div class="report-bar">
            <div class="stat-card"><p>Active Items</p><h3 id="totalItemsCount">0</h3></div>
            <div class="stat-card"><p>Critical Stock</p><h3 id="lowStockCount" style="color:var(--danger)">0</h3></div>
            <div class="stat-card"><p>Stock Health</p><h3 id="healthyCount" style="color:var(--success)">0</h3></div>
            <div class="stat-card"><p>Asset Value</p><h3 id="totalStockValue">₹0</h3></div>
        </div>

        <div class="inventory-grid" id="inventoryList"></div>
    </main>

    <div class="fab" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></div>
</div>

<div id="itemModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-bottom:20px; font-weight:900;">Add New Item</h2>
        <input type="text" id="itemName" class="modal-input" placeholder="Item Name">
        <input type="number" id="itemPrice" class="modal-input" placeholder="Cost Price (₹)">
        <input type="number" id="itemStock" class="modal-input" placeholder="Initial Stock">
        <input type="number" id="itemMin" class="modal-input" placeholder="Min Stock Alert">
        <button class="modal-btn" style="background:var(--primary); color:white;" onclick="saveItem()">SAVE ITEM</button>
        <button class="modal-btn" style="background:transparent; color:#94a3b8;" onclick="closeModal('itemModal')">Cancel</button>
    </div>
</div>

<div id="stockUpdateModal" class="modal">
    <div class="modal-content" style="text-align:center;">
        <h2 id="updateTitle" style="font-weight:900; margin-bottom:10px;">Restock</h2>
        <p id="updateItemName" style="opacity:0.6; margin-bottom:20px;"></p>
        <input type="number" id="updateQty" class="modal-input" placeholder="Enter Quantity" style="text-align:center; font-size:24px; font-weight:900;">
        <button id="confirmUpdateBtn" class="modal-btn" style="background:var(--success); color:white;">CONFIRM UPDATE</button>
        <button class="modal-btn" style="background:transparent; color:#94a3b8;" onclick="closeModal('stockUpdateModal')">Cancel</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let inventory = [];
    let currentTab = 'Bakery';
    let editingId = null;

    function initInventory() {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        db.collection("inventory").onSnapshot((snapshot) => {
            inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render();
        });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabBakery').classList.toggle('active', tab === 'Bakery');
        document.getElementById('tabRaw').classList.toggle('active', tab === 'Raw');
        render();
    }

    function render() {
        const list = document.getElementById("inventoryList");
        list.innerHTML = "";
        let lowCount = 0; let healthyCount = 0; let totalVal = 0;
        const filteredData = inventory.filter(item => (item.type || 'Bakery') === currentTab);

        filteredData.forEach((item) => {
            const min = parseFloat(item.minLevel) || 10;
            const currentStock = parseFloat(item.stock) || 0;
            const isLow = currentStock <= min;
            
            if(isLow) lowCount++; else healthyCount++;
            
            const price = parseFloat(item.price) || 0;
            const itemValue = currentStock * price;
            totalVal += itemValue;
            
            // Fix 2: Smart alert scaling calculation to dynamic bar mapping
            const maxTrackTarget = min > 0 ? min * 4 : 100;
            const progress = Math.min((currentStock / maxTrackTarget) * 100, 100); 
            
            list.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4 style="font-weight:800; font-size:18px; letter-spacing:-0.5px;">${item.name}</h4>
                        <div style="display:flex; gap:12px;">
                            <i class="fa-solid fa-pen-to-square" style="opacity:0.3; cursor:pointer" onclick="openEditModal('${item.id}')"></i>
                            <i class="fa-solid fa-trash" style="color:var(--danger); opacity:0.3; cursor:pointer" onclick="deleteItem('${item.id}', '${item.name}')"></i>
                        </div>
                    </div>
                    <div class="stock-display">
                        <span class="stock-level" style="color: ${isLow ? 'var(--danger)' : 'var(--primary)'}">${currentStock}</span>
                        <span class="unit">${item.unit || (currentTab==='Raw'?'Kg':'Pcs')}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700;">
                        <span style="opacity:0.5">COST PRICE</span>
                        <span>₹${price}</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="width: ${progress}%; background: ${isLow ? 'var(--danger)' : 'var(--success)'}"></div></div>
                    <div class="btn-group">
                        <button class="qty-btn minus" onclick="openStockUpdate('${item.id}', ${currentStock}, 'minus', '${item.name}')">- Use</button>
                        <button class="qty-btn plus" onclick="openStockUpdate('${item.id}', ${currentStock}, 'plus', '${item.name}')">+ Stock</button>
                    </div>
                    <div style="margin-top:20px; padding-top:15px; border-top:1px dashed #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:10px; font-weight:800; opacity:0.4;">VALUATION</span>
                        <span style="font-size:13px; font-weight:900;">₹${itemValue.toLocaleString('en-IN')}</span>
                    </div>
                </div>`;
        });
        document.getElementById("totalItemsCount").innerText = filteredData.length;
        document.getElementById("lowStockCount").innerText = lowCount;
        document.getElementById("healthyCount").innerText = healthyCount;
        document.getElementById("totalStockValue").innerText = "₹" + totalVal.toLocaleString('en-IN');
    }

    function closeModal(id) { document.getElementById(id).style.display = "none"; editingId = null; }

    // Fix 1: Form inputs clear state reset engine
    function openAddModal() {
        editingId = null;
        document.getElementById("modalTitle").innerText = "Add " + (currentTab === 'Bakery' ? "Product" : "Raw Material");
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemStock").value = "";
        document.getElementById("itemMin").value = "10";
        document.getElementById("itemModal").style.display = "flex";
    }

    function openEditModal(id) {
        editingId = id;
        const item = inventory.find(i => i.id === id);
        if(!item) return;
        document.getElementById("modalTitle").innerText = "Edit Item";
        document.getElementById("itemName").value = item.name || "";
        document.getElementById("itemPrice").value = item.price || 0;
        document.getElementById("itemStock").value = item.stock || 0;
        document.getElementById("itemMin").value = item.minLevel || 10;
        document.getElementById("itemModal").style.display = "flex";
    }

    async function saveItem() {
        const nameVal = document.getElementById("itemName").value.trim();
        if(!nameVal) return alert("Item name is required!");

        const data = {
            name: nameVal,
            price: parseFloat(document.getElementById("itemPrice").value) || 0,
            stock: parseFloat(document.getElementById("itemStock").value) || 0,
            minLevel: parseFloat(document.getElementById("itemMin").value) || 0,
            type: currentTab,
            unit: currentTab === 'Raw' ? 'Kg' : 'Pcs'
        };

        if(editingId) {
            await db.collection("inventory").doc(editingId).update(data);
        } else {
            await db.collection("inventory").add({
                ...data, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        closeModal('itemModal');
    }

    function openStockUpdate(id, current, mode, name) {
        document.getElementById("updateTitle").innerText = mode === 'plus' ? "Restock Item" : "Quick Use";
        document.getElementById("updateItemName").innerText = name;
        document.getElementById("updateQty").value = "";
        document.getElementById("confirmUpdateBtn").style.background = mode === 'plus' ? 'var(--success)' : 'var(--danger)';
        document.getElementById("stockUpdateModal").style.display = "flex";
        
        document.getElementById("confirmUpdateBtn").onclick = async function() {
            const val = parseFloat(document.getElementById("updateQty").value);
            if(isNaN(val) || val <= 0) return alert("Please enter a valid quantity!");
            
            const newStock = mode === 'plus' ? current + val : Math.max(0, current - val);
            await db.collection("inventory").doc(id).update({ stock: newStock });
            closeModal('stockUpdateModal');
        };
    }

    async function deleteItem(id, name) {
        if (confirm(`Are you sure you want to remove ${name}?`)) {
            await db.collection("inventory").doc(id).delete();
        }
    }

    function downloadReport() {
        let csv = "Type,Item,Stock,Unit,Price,TotalValue\n";
        inventory.forEach(i => { 
            csv += `"${i.type || 'Bakery'}","${i.name || 'Unnamed'}",${i.stock || 0},"${i.unit || 'Pcs'}",${i.price || 0},${(i.stock || 0) * (i.price || 0)}\n`; 
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Stock_Report_${new Date().toLocaleDateString('en-GB')}.csv`;
        a.click();
    }

    function go(p) { window.location.href = p; }
    window.onload = initInventory;
</script>
</body>
</html>
