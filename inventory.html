<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Master Inventory - Surjya Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #000; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); color: #1e293b; min-height: 100vh; }
        body.dark { background: #0f172a; color: #f1f5f9; }

        .app { display: flex; height: 100vh; }

        /* Sidebar Customization */
        .sidebar { 
            width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; 
            padding: 25px 20px; display: flex; flex-direction: column; 
            position: fixed; height: 100%; z-index: 1000; 
        }
        body.dark .sidebar { background: #1e293b; border-color: #334155; }
        
        .menu { list-style: none; flex-grow: 1; margin-top: 20px; }
        .menu li { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; margin-bottom: 5px; font-size: 14px; color: #64748b; font-weight: 600;
        }
        .menu li.active { background: var(--primary); color: #fff; }
        body.dark .menu li.active { background: #f8fafc; color: #000; }

        /* Content Area */
        .content { flex: 1; padding: 30px 40px; margin-left: 260px; overflow-y: auto; }
        
        /* Top Header Styling */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        /* Back Button Style */
        .back-btn { 
            background: #fff; border: 1px solid #e2e8f0; width: 42px; height: 42px; 
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; margin-right: 15px; color: #1e293b; transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.9); }
        body.dark .back-btn { background: #1e293b; border-color: #334155; color: #fff; }

        /* Navigation Tabs */
        .tab-bar { display: flex; gap: 10px; background: #e2e8f0; padding: 6px; border-radius: 16px; width: fit-content; margin-bottom: 30px; }
        body.dark .tab-bar { background: #1e293b; }
        .tab { padding: 10px 25px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.3s; color: #64748b; }
        .tab.active { background: #fff; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        body.dark .tab.active { background: #334155; color: #fff; }

        /* Analytics Bar */
        .report-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 24px; border: 1px solid #e2e8f0; }
        body.dark .stat-card { background: #1e293b; border-color: #334155; }
        .stat-card p { font-size: 11px; text-transform: uppercase; font-weight: 800; color: #94a3b8; margin-bottom: 8px; }
        .stat-card h3 { font-size: 22px; font-weight: 900; }

        /* Modern Inventory Grid */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { 
            background: #fff; border-radius: 28px; padding: 25px; border: 1px solid #e2e8f0; 
            transition: 0.3s ease; position: relative;
        }
        body.dark .card { background: #1e293b; border-color: #334155; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.06); }

        .stock-display { display: flex; align-items: baseline; gap: 8px; margin: 15px 0; }
        .stock-level { font-size: 32px; font-weight: 900; }
        .unit { font-size: 14px; color: #94a3b8; font-weight: 700; }

        /* Progress Bar */
        .progress-track { background: #f1f5f9; height: 10px; border-radius: 20px; margin: 20px 0; overflow: hidden; }
        body.dark .progress-track { background: #0f172a; }
        .progress-fill { height: 100%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 20px; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .qty-btn { 
            flex: 1; padding: 14px; border-radius: 16px; border: none; 
            cursor: pointer; font-weight: 800; font-size: 15px; transition: 0.2s;
        }
        .minus { background: #fee2e2; color: #ef4444; }
        .plus { background: #dcfce7; color: #10b981; }
        .qty-btn:active { transform: scale(0.95); }

        .export-btn { background: var(--primary); color: #fff; padding: 12px 20px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        body.dark .export-btn { background: #fff; color: #000; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 22px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        body.dark .fab { background: #f8fafc; color: #000; }

        @media(max-width: 768px){ 
            .sidebar{ display: none; } 
            .content{ margin-left: 0; padding: 20px; } 
            .report-bar { grid-template-columns: 1fr 1fr; }
            .inventory-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <img src="https://raw.githubusercontent.com/pritam-creator/billingbuddy-assets/refs/heads/main/Untitled.png" class="logo">
        <ul class="menu">
            <li onclick="go('dashboard.html')"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
            <li onclick="go('items.html')"><i class="fa-solid fa-cookie-bite"></i> Items</li>
            <li class="active"><i class="fa-solid fa-boxes-stacked"></i> Inventory</li>
            <li onclick="go('ledger.html')"><i class="fa-solid fa-book"></i> Ledger</li>
        </ul>
    </aside>

    <main class="content">
        <header class="top-header">
            <div style="display: flex; align-items: center;">
                <button class="back-btn" onclick="go('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
                <div>
                    <h1 style="font-weight: 900; letter-spacing: -1.5px; font-size: 32px;">Warehouse</h1>
                    <p style="font-size: 13px; font-weight: 600; opacity: 0.5;">Manage your stocks & raw materials</p>
                </div>
            </div>
            <button class="export-btn" onclick="downloadReport()">
                <i class="fa-solid fa-file-arrow-down"></i> Export
            </button>
        </header>

        <div class="tab-bar">
            <div class="tab active" id="tabBakery" onclick="switchTab('Bakery')">FINISHED PRODUCTS</div>
            <div class="tab" id="tabRaw" onclick="switchTab('Raw')">RAW MATERIALS</div>
        </div>

        <div class="report-bar">
            <div class="stat-card"><p>Active Items</p><h3 id="totalItemsCount">0</h3></div>
            <div class="stat-card"><p>Critical Stock</p><h3 id="lowStockCount" style="color:var(--danger)">0</h3></div>
            <div class="stat-card"><p>Stock Health</p><h3 id="healthyCount" style="color:var(--success)">0</h3></div>
            <div class="stat-card"><p>Asset Value</p><h3 id="totalStockValue">₹0</h3></div>
        </div>

        <div class="inventory-grid" id="inventoryList"></div>
    </main>

    <div class="fab" onclick="addItem()"><i class="fa-solid fa-plus"></i></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjETFSgZsMDw1JRI0fIcUNMCMOHxBMaLA",
        authDomain: "billingbuddy-551f9.firebaseapp.com",
        projectId: "billingbuddy-551f9",
        appId: "1:287026017084:web:aae879570ad706e5a2a439"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let inventory = [];
    let currentTab = 'Bakery';

    function initInventory() {
        if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
        db.collection("inventory").onSnapshot((snapshot) => {
            inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render();
        });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabBakery').classList.toggle('active', tab === 'Bakery');
        document.getElementById('tabRaw').classList.toggle('active', tab === 'Raw');
        render();
    }

    function render() {
        const list = document.getElementById("inventoryList");
        list.innerHTML = "";
        let lowCount = 0; let healthyCount = 0; let totalVal = 0;

        const filteredData = inventory.filter(item => (item.type || 'Bakery') === currentTab);

        filteredData.forEach((item) => {
            const min = item.minLevel || 10;
            const isLow = item.stock <= min;
            if(isLow) lowCount++; else healthyCount++;
            
            const price = parseFloat(item.price) || 0;
            const itemValue = item.stock * price;
            totalVal += itemValue;

            const progress = Math.min((item.stock / (min * 5)) * 100, 100); 
            
            list.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4 style="font-weight:800; font-size:18px; letter-spacing:-0.5px;">${item.name}</h4>
                        <div style="display:flex; gap:10px;">
                            <i class="fa-solid fa-pen-to-square" style="opacity:0.3; cursor:pointer" onclick="editItem('${item.id}')"></i>
                            <i class="fa-solid fa-trash" style="color:var(--danger); opacity:0.3; cursor:pointer" onclick="deleteItem('${item.id}', '${item.name}')"></i>
                        </div>
                    </div>

                    <div class="stock-display">
                        <span class="stock-level" style="color: ${isLow ? 'var(--danger)' : 'var(--primary)'}">
                            ${item.stock}
                        </span>
                        <span class="unit">${item.unit || (currentTab==='Raw'?'Kg':'Pcs')}</span>
                    </div>

                    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700;">
                        <span style="opacity:0.5">PURCHASE PRICE</span>
                        <span>₹${price} / ${item.unit || (currentTab==='Raw'?'Kg':'Pcs')}</span>
                    </div>

                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${progress}%; background: ${isLow ? 'var(--danger)' : 'var(--success)'}"></div>
                    </div>

                    <div class="btn-group">
                        <button class="qty-btn minus" onclick="handleStockUpdate('${item.id}', ${item.stock}, 'minus')">- Quick Use</button>
                        <button class="qty-btn plus" onclick="handleStockUpdate('${item.id}', ${item.stock}, 'plus')">+ Restock</button>
                    </div>
                    
                    <div style="margin-top:20px; padding-top:15px; border-top:1px dashed #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:10px; font-weight:800; opacity:0.4;">TOTAL VALUATION</span>
                        <span style="font-size:13px; font-weight:900;">₹${itemValue.toLocaleString()}</span>
                    </div>
                </div>`;
        });

        document.getElementById("totalItemsCount").innerText = filteredData.length;
        document.getElementById("lowStockCount").innerText = lowCount;
        document.getElementById("healthyCount").innerText = healthyCount;
        document.getElementById("totalStockValue").innerText = "₹" + totalVal.toLocaleString();
    }

    // New Function to handle bulk updates
    async function handleStockUpdate(id, current, mode) {
        const message = mode === 'plus' ? "Kitna stock ADD karna hai?" : "Kitna stock MINUS karna hai?";
        const input = prompt(message, "1");
        
        if (input === null || input === "" || isNaN(input)) return;
        
        const amount = parseFloat(input);
        const newStock = mode === 'plus' ? current + amount : Math.max(0, current - amount);
        
        await db.collection("inventory").doc(id).update({ stock: newStock });
    }

    async function addItem() {
        const type = currentTab;
        const name = prompt(`Enter ${type} Name:`);
        if (!name) return;
        const price = prompt("Cost Price per unit:", "0");
        const stock = prompt("Initial Stock:", "0");
        const min = prompt("Alert at what level? (Min Stock):", "10");
        const unit = type === 'Raw' ? 'Kg' : 'Pcs';

        await db.collection("inventory").add({
            name, type, price: parseFloat(price), stock: parseFloat(stock), minLevel: parseFloat(min),
            unit: unit, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    async function editItem(id) {
        const item = inventory.find(i => i.id === id);
        const newPrice = prompt("Update Price:", item.price);
        const newMin = prompt("Update Min Alert Level:", item.minLevel);
        if(newPrice !== null) {
            await db.collection("inventory").doc(id).update({ 
                price: parseFloat(newPrice),
                minLevel: parseFloat(newMin)
            });
        }
    }

    async function deleteItem(id, name) {
        if (confirm(`Are you sure? This will remove ${name} from all records.`)) {
            await db.collection("inventory").doc(id).delete();
        }
    }

    function downloadReport() {
        let csv = "Type,Item,Stock,Unit,Price,TotalValue\n";
        inventory.forEach(i => {
            csv += `${i.type},${i.name},${i.stock},${i.unit},${i.price},${i.stock * i.price}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Bakery_Stock_${new Date().toLocaleDateString()}.csv`;
        a.click();
    }

    function go(p) { window.location.href = p; }
    window.onload = initInventory;
</script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error:", message, "at", source, lineno);
    };
</script>
</body>
</html>
